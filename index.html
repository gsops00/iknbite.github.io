  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var ld = document.getElementById('app-loading');
      if (ld) ld.style.display = 'none';
    });
    document.addEventListener('DOMContentLoaded', function() {
      gsap.registerPlugin(ScrollTrigger);
      // Scroll reveal for [data-reveal] elements
      document.querySelectorAll('[data-reveal]').forEach(function(el) {
        gsap.from(el, {
          opacity: 0, y: 16, duration: 0.5,
          ease: 'power1.out',
          scrollTrigger: { trigger: el, start: 'top 92%', toggleActions: 'play none none reverse' }
        });
      });
      // Stagger reveal for grid items
      document.querySelectorAll('.anim-stagger').forEach(function(container) {
        var items = container.children;
        gsap.from(items, {
          opacity: 0, y: 12, duration: 0.35, stagger: 0.04,
          ease: 'power1.out',
          scrollTrigger: { trigger: container, start: 'top 90%', toggleActions: 'play none none reverse' }
        });
      });
    });
