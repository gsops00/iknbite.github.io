<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">

  <title>iknbite — AI Voice Studio</title>
  <meta name="description" content="Free, open-source AI voice studio. Clone voices, generate speech, transcribe audio — all running locally on your machine.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎙️</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50:'#f0f4ff',100:'#dbe4ff',200:'#bac8ff',300:'#91a7ff',400:'#748ffc',500:'#5c7cfa',600:'#4c6ef5',700:'#4263eb',800:'#3b5bdb',900:'#364fc7',950:'#1e2a5e' },
            surface: { 50:'#fafafa',100:'#f4f4f5',200:'#e4e4e7',800:'#27272a',900:'#18181b',950:'#09090b' },
            emerald: { 400:'#34d399',500:'#10b981' },
            amber: { 400:'#fbbf24',500:'#f59e0b' },
            rose: { 400:'#fb7185',500:'#f43f5e' }
          },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] }

      }

  <style>
    * { scrollbar-width: thin; scrollbar-color: #3b5bdb #09090b; }
    ::selection { background: #4c6ef544; }
    body { font-family: 'Inter', system-ui, sans-serif; }

    /* Glass morphism */
    .glass { background: rgba(24,24,27,0.75); backdrop-filter: blur(24px) saturate(180%); border: 1px solid rgba(255,255,255,0.06); }
    .glass-subtle { background: rgba(255,255,255,0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
    .glass-strong { background: rgba(15,15,18,0.9); backdrop-filter: blur(32px); border: 1px solid rgba(255,255,255,0.08); }

    /* Gradients */
    .gradient-text { background: linear-gradient(135deg, #748ffc 0%, #cc5de8 50%, #ff6b6b 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .gradient-text-warm { background: linear-gradient(135deg, #fbbf24 0%, #f97316 50%, #ef4444 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .gradient-bg { background: linear-gradient(135deg, #4c6ef5, #7950f2, #cc5de8); }
    .gradient-border { position: relative; }
    .gradient-border::before { content: ''; position: absolute; inset: -1px; border-radius: inherit; background: linear-gradient(135deg, rgba(92,124,250,0.4), rgba(204,93,232,0.4)); z-index: -1; mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); mask-composite: exclude; padding: 1px; }

    /* Glow */
    .glow { box-shadow: 0 0 60px rgba(92,124,250,0.15), 0 0 120px rgba(92,124,250,0.05); }
    .glow-sm { box-shadow: 0 0 30px rgba(92,124,250,0.1); }
    .glow-emerald { box-shadow: 0 0 30px rgba(16,185,129,0.15); }

    /* Hero */
    .hero-gradient { background: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(92,124,250,0.18), transparent), radial-gradient(ellipse 60% 40% at 80% 50%, rgba(204,93,232,0.08), transparent), radial-gradient(ellipse 40% 30% at 20% 80%, rgba(16,185,129,0.06), transparent); }
    .mesh-bg { background-image: radial-gradient(at 40% 20%, rgba(92,124,250,0.08) 0px, transparent 50%), radial-gradient(at 80% 0%, rgba(204,93,232,0.06) 0px, transparent 50%), radial-gradient(at 0% 50%, rgba(92,210,250,0.04) 0px, transparent 50%); }

    /* Animations */
    .slide-up { animation: slideUp 0.7s cubic-bezier(0.16,1,0.3,1) both; }
    .slide-up-1 { animation-delay: 0.1s; }
    .slide-up-2 { animation-delay: 0.2s; }
    .slide-up-3 { animation-delay: 0.3s; }
    .slide-up-4 { animation-delay: 0.4s; }
    @keyframes slideUp { from { opacity:0; transform:translateY(30px); } to { opacity:1; transform:translateY(0); } }
    @keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-8px); } }
    @keyframes pulse-ring { 0% { transform:scale(0.8); opacity:1; } 100% { transform:scale(2.5); opacity:0; } }
    @keyframes waveform { 0%,100% { height:6px; } 50% { height:28px; } }
    @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    .float { animation: float 6s ease-in-out infinite; }
    .spin-slow { animation: spin-slow 20s linear infinite; }
    .shimmer { background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent); background-size: 200% 100%; animation: shimmer 3s ease-in-out infinite; }

    .waveform-bar { animation: waveform 1s ease-in-out infinite; width: 3px; border-radius: 2px; }
    .waveform-bar:nth-child(2) { animation-delay: 0.1s; }
    .waveform-bar:nth-child(3) { animation-delay: 0.2s; }
    .waveform-bar:nth-child(4) { animation-delay: 0.3s; }
    .waveform-bar:nth-child(5) { animation-delay: 0.4s; }
    .waveform-bar:nth-child(6) { animation-delay: 0.5s; }
    .waveform-bar:nth-child(7) { animation-delay: 0.6s; }
    .waveform-bar:nth-child(8) { animation-delay: 0.7s; }

    /* Cards */
    .card-hover { transition: all 0.4s cubic-bezier(0.4,0,0.2,1); }
    .card-hover:hover { transform: translateY(-6px); box-shadow: 0 25px 50px rgba(0,0,0,0.4), 0 0 40px rgba(92,124,250,0.1); }

    /* Buttons */
    .btn-primary { background: linear-gradient(135deg, #4c6ef5, #7950f2); color: white; padding: 12px 28px; border-radius: 14px; font-weight: 600; font-size: 14px; transition: all 0.3s; cursor: pointer; border: none; }
    .btn-primary:hover { opacity: 0.9; box-shadow: 0 8px 30px rgba(76,110,245,0.3); transform: translateY(-1px); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-secondary { background: rgba(255,255,255,0.06); color: white; padding: 12px 28px; border-radius: 14px; font-weight: 600; font-size: 14px; border: 1px solid rgba(255,255,255,0.08); transition: all 0.3s; cursor: pointer; }
    .btn-secondary:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.15); }
    .btn-ghost { background: transparent; color: #a1a1aa; padding: 8px 16px; border-radius: 10px; font-weight: 500; font-size: 13px; transition: all 0.3s; cursor: pointer; border: none; }
    .btn-ghost:hover { color: white; background: rgba(255,255,255,0.06); }

    /* Status dots */
    .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .status-connected { background: #51cf66; box-shadow: 0 0 12px #51cf6680; }
    .status-disconnected { background: #ff6b6b; box-shadow: 0 0 12px #ff6b6b80; }
    .status-loading { background: #fcc419; box-shadow: 0 0 12px #fcc41980; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }

    /* Inputs */
    textarea:focus, input:focus, select:focus { outline: none; box-shadow: 0 0 0 2px rgba(92,124,250,0.5); }

    /* Tabs */
    .tab-active { background: rgba(92,124,250,0.15); color: #748ffc; border-color: rgba(92,124,250,0.4); }

    /* Misc */
    .noise { background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.02'/%3E%3C/svg%3E"); }
    .section-divider { height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent); }
    .hidden { display: none !important; }

    /* Audio player custom */
    audio::-webkit-media-controls-panel { background: rgba(30,30,40,0.9); }
    audio { filter: hue-rotate(220deg) saturate(0.8); border-radius: 10px; height: 40px; width: 100%; }

    /* Modal overlay */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); z-index: 50; display: flex; align-items: center; justify-content: center; }
    .modal-content { background: #18181b; border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 32px; max-width: 520px; width: 90%; max-height: 80vh; overflow-y: auto; }

    /* Sidebar */
    .sidebar-item { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-radius: 12px; color: #a1a1aa; font-weight: 500; font-size: 14px; transition: all 0.2s; cursor: pointer; border: none; background: none; width: 100%; text-align: left; }
    .sidebar-item:hover { color: white; background: rgba(255,255,255,0.05); }
    .sidebar-item.active { color: #748ffc; background: rgba(92,124,250,0.1); }

    /* Range slider */
    input[type="range"] { -webkit-appearance: none; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.1); }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: linear-gradient(135deg, #4c6ef5, #7950f2); cursor: pointer; box-shadow: 0 2px 8px rgba(76,110,245,0.4); }

    @media (max-width: 768px) {
      .hero-title { font-size: 2.5rem !important; }
      .app-sidebar { display: none; }
    }

    /* Tooltip */
    [data-tooltip] { position: relative; }
    [data-tooltip]:hover::after { content: attr(data-tooltip); position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); background: #27272a; color: white; padding: 6px 12px; border-radius: 8px; font-size: 12px; white-space: nowrap; z-index: 100; border: 1px solid rgba(255,255,255,0.1); }
  </style>
</head>
<body class="bg-surface-950 text-white min-h-screen noise">
  <div id="app"></div>

<script>
// ─── Configuration ────────────────────────────────────────────────
const DEFAULT_API = 'http://localhost:17493';
let API = localStorage.getItem('iknbite_api_url') || DEFAULT_API;

// ─── State ────────────────────────────────────────────────────────
let currentView = 'landing'; // landing | app
let currentTab = 'generate';
let health = null;
let profiles = [];
let presetVoices = { kokoro: [], qwen_custom_voice: [] };
let history = [];
let effectsPresets = [];
let availableEffects = [];
let isGenerating = false;
let isTranscribing = false;
let sseConnected = false;
let activeTasks = [];

// Generate form
let genText = '';
let genProfileId = '';
let genEngine = 'kokoro';
let genLanguage = 'en';
let genInstruct = '';
let genSeed = '';
let genNormalize = true;
let genMaxChunkChars = 2000;
let genCrossfadeMs = 50;

// Settings
let settingsApiKey = localStorage.getItem('iknbite_api_key') || '';

// ─── Engine Definitions ───────────────────────────────────────────
const ENGINES = [
  { id: 'kokoro', name: 'Kokoro', desc: '82M model, 50 preset voices, fast CPU', langs: ['en','ja','zh','fr','es','de','hi','pt'], badge: 'Fast', color: '#34d399' },
  { id: 'qwen', name: 'Qwen3-TTS', desc: '0.6B / 1.7B, high-quality cloning', langs: ['en','ja','zh','ko','fr','es','de','ru','ar','hi'], badge: 'Quality', color: '#748ffc' },
  { id: 'qwen_custom_voice', name: 'Qwen CustomVoice', desc: '9 preset voices, delivery control', langs: ['en','ja','zh','ko','fr','es','de','ru','ar','hi'], badge: 'Presets', color: '#cc5de8' },
  { id: 'chatterbox', name: 'Chatterbox', desc: '23 languages, multilingual', langs: ['en','ar','da','fi','el','he','hi','ms','no','pl','sv','sw','tr','fr','es','de','ja','zh','ko','pt','ru','it','nl'], badge: '23 Langs', color: '#fbbf24' },
  { id: 'chatterbox_turbo', name: 'Chatterbox Turbo', desc: '350M, paralinguistic tags', langs: ['en'], badge: 'Expressive', color: '#f97316' },
  { id: 'luxtts', name: 'LuxTTS', desc: '~1GB VRAM, 48kHz, 150x realtime', langs: ['en'], badge: 'Light', color: '#06b6d4' },
  { id: 'hume', name: 'Hume TADA', desc: '1B / 3B, 700s+ coherent audio', langs: ['en','ja','zh','ko','fr','es','de','ru','ar','hi'], badge: 'Long', color: '#f43f5e' },
];

const LANGUAGES = {
  en: 'English', ja: 'Japanese', zh: 'Chinese', ko: 'Korean', fr: 'French',
  es: 'Spanish', de: 'German', ru: 'Russian', ar: 'Arabic', hi: 'Hindi',
  pt: 'Portuguese', it: 'Italian', nl: 'Dutch', sv: 'Swedish', da: 'Danish',
  fi: 'Finnish', el: 'Greek', he: 'Hebrew', ms: 'Malay', no: 'Norwegian',
  pl: 'Polish', tr: 'Turkish', sw: 'Swahili'
};

const EFFECTS_LIST = [
  { id: 'pitch_shift', name: 'Pitch Shift', icon: '🎵', params: { semitones: 0 } },
  { id: 'reverb', name: 'Reverb', icon: '🏟️', params: { room_size: 0.5, damping: 0.5, wet_level: 0.3 } },
  { id: 'delay', name: 'Delay', icon: '🔄', params: { delay_seconds: 0.3, feedback: 0.4, mix: 0.3 } },
  { id: 'chorus', name: 'Chorus', icon: '🌊', params: { rate: 1.0, depth: 0.5, mix: 0.3 } },
  { id: 'compressor', name: 'Compressor', icon: '📊', params: { threshold: -20, ratio: 4, attack: 0.005, release: 0.1 } },
  { id: 'gain', name: 'Gain', icon: '🔊', params: { db: 0 } },
  { id: 'highpass', name: 'High-Pass', icon: '📈', params: { cutoff_hz: 200 } },
  { id: 'lowpass', name: 'Low-Pass', icon: '📉', params: { cutoff_hz: 3000 } },
];

const TABS = [
  { id: 'generate', label: 'Generate', icon: '⚡' },
  { id: 'voices', label: 'Voices', icon: '🎤' },
  { id: 'effects', label: 'Effects', icon: '🎛️' },
  { id: 'transcribe', label: 'Transcribe', icon: '📝' },
  { id: 'history', label: 'History', icon: '🕐' },
  { id: 'settings', label: 'Settings', icon: '⚙️' },
];

// ─── API Helpers ──────────────────────────────────────────────────
function apiHeaders() {
  const h = { 'Content-Type': 'application/json' };
  if (settingsApiKey) h['Authorization'] = `Bearer ${settingsApiKey}`;
  return h;
}

async function apiFetch(path, opts = {}) {
  try {
    const res = await fetch(`${API}${path}`, {
      ...opts,
      headers: { ...apiHeaders(), ...(opts.headers || {}) },
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({ detail: res.statusText }));
      throw new Error(err.detail || res.statusText);
    }
    return await res.json();
  } catch (e) {
    console.error(`API ${path}:`, e);
    throw e;
  }
}

// ─── Health Check ─────────────────────────────────────────────────
async function checkHealth() {
  try {
    health = await apiFetch('/health');
    sseConnected = true;
  } catch {
    health = null;
    sseConnected = false;
  }
  render();
}

// ─── Profiles ─────────────────────────────────────────────────────
async function loadProfiles() {
  try {
    profiles = await apiFetch('/profiles');
  } catch { profiles = []; }
  render();
}

async function loadPresets() {
  for (const engine of ['kokoro', 'qwen_custom_voice']) {
    try {
      const data = await apiFetch(`/profiles/presets/${engine}`);
      presetVoices[engine] = data.voices || [];
    } catch { presetVoices[engine] = []; }
  }
  render();
}

async function createProfile(name, language, description) {
  await apiFetch('/profiles', {
    method: 'POST',
    body: JSON.stringify({ name, language, description: description || '' }),
  });
  await loadProfiles();
}

async function deleteProfile(id) {
  await apiFetch(`/profiles/${id}`, { method: 'DELETE' });
  await loadProfiles();
}

// ─── Generate ─────────────────────────────────────────────────────
async function generateSpeech() {
  if (!genText.trim() || isGenerating) return;
  isGenerating = true;
  render();

  try {
    const body = {
      text: genText,
      engine: genEngine,
      language: genLanguage,
      normalize: genNormalize,
      max_chunk_chars: genMaxChunkChars,
      crossfade_ms: genCrossfadeMs,
    };
    if (genProfileId) body.profile_id = genProfileId;
    if (genInstruct) body.instruct = genInstruct;
    if (genSeed) body.seed = parseInt(genSeed);

    const result = await apiFetch('/generate', { method: 'POST', body: JSON.stringify(body) });
    if (result.id) {
      activeTasks.push({ id: result.id, status: 'generating', text: genText.substring(0, 50) });
      pollGeneration(result.id);
    }
  } catch (e) {
    alert('Generation failed: ' + e.message);
  } finally {
    isGenerating = false;
    render();
  }
}

async function pollGeneration(id) {
  const maxAttempts = 120;
  for (let i = 0; i < maxAttempts; i++) {
    await new Promise(r => setTimeout(r, 1000));
    try {
      const gen = await apiFetch(`/generations/${id}`);
      if (gen.status === 'completed') {
        activeTasks = activeTasks.filter(t => t.id !== id);
        await loadHistory();
        render();
        return;
      }
      if (gen.status === 'failed') {
        activeTasks = activeTasks.filter(t => t.id !== id);
        alert('Generation failed: ' + (gen.error || 'Unknown error'));
        render();
        return;
      }
    } catch { /* retry */ }
  }
  activeTasks = activeTasks.filter(t => t.id !== id);
  render();
}

// ─── Transcribe ───────────────────────────────────────────────────
async function transcribeFile(file) {
  isTranscribing = true;
  render();
  try {
    const formData = new FormData();
    formData.append('file', file);
    const res = await fetch(`${API}/transcribe`, {
      method: 'POST',
      headers: settingsApiKey ? { 'Authorization': `Bearer ${settingsApiKey}` } : {},
      body: formData,
    });
    if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
    const result = await res.json();
    genText = result.text || '';
    currentTab = 'generate';
    render();
  } catch (e) {
    alert('Transcription failed: ' + e.message);
  } finally {
    isTranscribing = false;
    render();
  }
}

// ─── History ──────────────────────────────────────────────────────
async function loadHistory() {
  try {
    const data = await apiFetch('/history?limit=50');
    history = data.generations || data || [];
  } catch { history = []; }
  render();
}

async function deleteGeneration(id) {
  try {
    await apiFetch(`/generations/${id}`, { method: 'DELETE' });
    await loadHistory();
  } catch (e) { alert('Delete failed: ' + e.message); }
}

// ─── Effects ──────────────────────────────────────────────────────
async function loadEffects() {
  try {
    const data = await apiFetch('/effects/available');
    availableEffects = data.effects || [];
  } catch { availableEffects = EFFECTS_LIST; }
  try {
    effectsPresets = await apiFetch('/effects/presets');
  } catch { effectsPresets = []; }
  render();
}

// ─── Rendering ────────────────────────────────────────────────────
function render() {
  const app = document.getElementById('app');
  if (currentView === 'landing') {
    app.innerHTML = renderLanding();
  } else {
    app.innerHTML = renderApp();
  }
  attachEventListeners();
}

function renderLanding() {
  return `
  <div class="min-h-screen hero-gradient mesh-bg noise">
    <!-- Nav -->
    <nav class="fixed top-0 w-full z-50 glass">
      <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-xl gradient-bg flex items-center justify-center text-white font-bold text-sm">iK</div>
          <span class="text-lg font-bold tracking-tight">iknbite</span>

        <div class="flex items-center gap-3">
          <a href="https://github.com/gsops00/iknbite.github.io" target="_blank" class="btn-ghost flex items-center gap-2">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
            GitHub
          </a>
          <button onclick="currentView='app';render()" class="btn-primary text-sm">Open Studio →</button>
        </div>
      </div>
    </nav>

    <!-- Hero -->
    <section class="pt-32 pb-20 px-6">
      <div class="max-w-5xl mx-auto text-center slide-up">
        <div class="inline-flex items-center gap-2 glass-subtle rounded-full px-4 py-2 mb-8 text-sm text-brand-300">
          <span class="status-dot status-connected"></span>
          100% Free & Open Source — No API Keys Required
        </div>
        <h1 class="hero-title text-5xl md:text-7xl font-black tracking-tight mb-6">
          <span class="gradient-text">AI Voice Studio</span>
        </h1>
        <p class="text-xl md:text-2xl text-gray-400 max-w-3xl mx-auto mb-10 leading-relaxed">
          Clone any voice. Generate speech in 23 languages.<br class="hidden md:block">
          Transcribe audio. Apply studio effects — all running <span class="text-white font-semibold">locally on your machine</span>.
        </p>
        <div class="flex flex-col sm:flex-row items-center justify-center gap-4 mb-16 slide-up slide-up-1">
          <button onclick="currentView='app';render()" class="btn-primary text-base px-8 py-4 rounded-2xl flex items-center gap-2">
            ⚡ Launch Studio
          </button>
          <a href="#features" class="btn-secondary text-base px-8 py-4 rounded-2xl">Learn More ↓</a>

      <button onclick="loadHistory()" class="btn-ghost text-xs">Refresh</button>
    </div>
    ${history.length === 0 ? `
      <div class="glass-subtle rounded-2xl p-12 text-center">
        <div class="text-5xl mb-4">🕐</div>
        <p class="text-gray-400">No generations yet. Start by generating some speech!</p>
      </div>
    ` : `
      <div class="space-y-3">
        ${history.map(g => `
          <div class="glass-subtle rounded-xl p-4 flex items-center gap-4">
            <div class="w-10 h-10 rounded-xl flex items-center justify-center text-lg shrink-0 ${g.status === 'completed' ? 'bg-emerald-500/20 text-emerald-400' : g.status === 'failed' ? 'bg-rose-500/20 text-rose-400' : 'bg-amber-500/20 text-amber-400'}">
              ${g.status === 'completed' ? '✓' : g.status === 'failed' ? '✗' : '⏳'}
            </div>
            <div class="flex-1 min-w-0">
              <div class="text-sm font-medium truncate">${(g.text || '').substring(0, 80)}</div>
              <div class="text-xs text-gray-500 mt-0.5">
                ${g.engine || 'unknown'} • ${g.language || 'en'} • ${g.duration ? g.duration.toFixed(1) + 's' : '—'}
                ${g.created_at ? ' • ' + new Date(g.created_at).toLocaleDateString() : ''}
              </div>
            </div>
            <div class="flex items-center gap-2 shrink-0">
              ${g.status === 'completed' && g.id ? `
                <audio controls preload="none" src="${API}/generations/${g.id}/audio" class="w-48"></audio>
              ` : ''}
              ${g.status === 'completed' && g.id ? `
                <a href="${API}/generations/${g.id}/download" class="btn-ghost text-xs">↓</a>
              ` : ''}
              <button onclick="deleteGeneration('${g.id}')" class="btn-ghost text-xs text-rose-400">✕</button>
            </div>
          </div>
        `).join('')}
      </div>
    `}
  </div>`;
}

function renderSettingsTab() {
  return `
  <div class="max-w-3xl mx-auto space-y-6">
    <div class="glass-subtle rounded-2xl p-6">
      <h3 class="font-bold mb-4">Backend Connection</h3>
      <div class="space-y-4">
        <div>
          <label class="text-xs text-gray-400 mb-1 block">API URL</label>
          <input type="text" value="${API}" id="api-url-input"
            class="w-full bg-white/[0.05] border border-white/10 rounded-xl px-4 py-3 text-sm font-mono"
            placeholder="http://localhost:17493">
          <p class="text-[11px] text-gray-600 mt-1">Default: http://localhost:17493 — The URL of your Voicebox backend.</p>
        </div>
        <div>
          <label class="text-xs text-gray-400 mb-1 block">API Key (optional)</label>
          <input type="password" value="${settingsApiKey}" id="api-key-input"
            class="w-full bg-white/[0.05] border border-white/10 rounded-xl px-4 py-3 text-sm"
            placeholder="Leave empty if not using auth">
        </div>
        <button onclick="saveSettings()" class="btn-primary rounded-xl">Save & Reconnect</button>
      </div>
    </div>

    <div class="glass-subtle rounded-2xl p-6">
      <h3 class="font-bold mb-4">Server Status</h3>
      <div class="space-y-3">
        <div class="flex items-center justify-between p-3 rounded-lg bg-white/[0.03]">
          <span class="text-sm text-gray-400">Connection</span>
          <span class="flex items-center gap-2 text-sm">
            <span class="status-dot ${sseConnected ? 'status-connected' : 'status-disconnected'}"></span>
            ${sseConnected ? 'Connected' : 'Disconnected'}
          </span>
        </div>
        ${health ? `
          <div class="flex items-center justify-between p-3 rounded-lg bg-white/[0.03]">
            <span class="text-sm text-gray-400">GPU</span>
            <span class="text-sm">${health.gpu_type || 'Not available'}</span>
          </div>
          <div class="flex items-center justify-between p-3 rounded-lg bg-white/[0.03]">
            <span class="text-sm text-gray-400">Model Loaded</span>
            <span class="text-sm">${health.model_loaded ? '✓ Yes' : '✗ No'} ${health.model_size ? `(${health.model_size})` : ''}</span>
          </div>
          <div class="flex items-center justify-between p-3 rounded-lg bg-white/[0.03]">
            <span class="text-sm text-gray-400">Backend</span>
            <span class="text-sm font-mono">${health.backend_type || 'unknown'} (${health.backend_variant || 'cpu'})</span>
          </div>
          ${health.vram_used_mb ? `
            <div class="flex items-center justify-between p-3 rounded-lg bg-white/[0.03]">
              <span class="text-sm text-gray-400">VRAM Used</span>
              <span class="text-sm">${Math.round(health.vram_used_mb)} MB</span>
            </div>
          ` : ''}
        ` : `
          <div class="text-center py-4 text-gray-600 text-sm">Cannot reach backend. Make sure Voicebox server is running.</div>
        `}
      </div>
    </div>

    <div class="glass-subtle rounded-2xl p-6">
      <h3 class="font-bold mb-4">About</h3>
      <div class="space-y-2 text-sm text-gray-400">
        <p>iknbite AI Voice Studio — A free, open-source voice studio built on <a href="https://github.com/jamiepine/voicebox" target="_blank" class="text-brand-400 hover:underline">Voicebox</a>.</p>
        <p>All TTS engines are open-source: Kokoro, Qwen3-TTS, Chatterbox, LuxTTS, Hume TADA.</p>
        <p class="text-gray-600 text-xs mt-4">No data leaves your machine. No API keys required. No subscriptions.</p>
      </div>
    </div>
  </div>`;
}

function saveSettings() {
  const urlInput = document.getElementById('api-url-input');
  const keyInput = document.getElementById('api-key-input');
  if (urlInput) {
    API = urlInput.value.replace(/\/+$/, '');
    localStorage.setItem('iknbite_api_url', API);
  }
  if (keyInput) {
    settingsApiKey = keyInput.value;
    localStorage.setItem('iknbite_api_key', settingsApiKey);
  }
  checkHealth();
  loadProfiles();
  loadPresets();
}

// ─── Event Listeners ──────────────────────────────────────────────
function attachEventListeners() {
  // Auto-refresh on tab switch
  if (currentView === 'app') {
    if (currentTab === 'history' && history.length === 0) loadHistory();
    if (currentTab === 'voices' && profiles.length === 0) loadProfiles();
    if (currentTab === 'effects' && effectsPresets.length === 0) loadEffects();
  }
}

// ─── Init ─────────────────────────────────────────────────────────
render();
checkHealth().then(() => {
  if (currentView === 'app') {
    loadProfiles();
    loadPresets();
  }
});
</script>
</body>
</html>
