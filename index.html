var LANGUAGES = {en:'English',ja:'Japanese',zh:'Chinese',ko:'Korean',fr:'French',es:'Spanish',de:'German',ru:'Russian',ar:'Arabic',hi:'Hindi',pt:'Portuguese',it:'Italian'};

function applyTheme() {
  if (isDark) {
    document.documentElement.classList.add('dark');
  } else {
    document.documentElement.classList.remove('dark');
  }
}

function toggleDark() {
  isDark = !isDark;
  localStorage.setItem('iknbite_dark', isDark);
  applyTheme();
  render();
}

function toggleFav(cid) {
  var idx = favorites.indexOf(cid);
  if (idx >= 0) favorites.splice(idx, 1);
  else favorites.push(cid);
  localStorage.setItem('iknbite_favs', JSON.stringify(favorites));
  render();
}

function isFav(cid) { return favorites.indexOf(cid) >= 0; }

function cb() { return isDark ? 'bg-[#1a1a1a] border-[#333]' : 'bg-white border-surface-200'; }
function ct() { return isDark ? 'text-white' : 'text-surface-900'; }
function cs() { return isDark ? 'text-surface-400' : 'text-surface-500'; }
function ci() { return isDark ? 'bg-[#262626] border-[#404040]' : 'bg-surface-50 border-surface-200'; }
function cvc() { return isDark ? 'bg-[#1a1a1a] border-[#333]' : 'bg-white border-surface-200'; }

function findBrowserVoice(lang) {
  var langMap = {en:'en',ja:'ja',zh:'zh',ko:'ko',fr:'fr',es:'es',de:'de',ru:'ru',ar:'ar',hi:'hi',pt:'pt',it:'it'};
  var target = langMap[lang] || 'en';
  var best = null;
  for (var i = 0; i < webSpeechVoices.length; i++) {
    var v = webSpeechVoices[i];
    if (v.lang.indexOf(target) === 0) {
      if (!best) best = v;
      if (v.localService) best = v;
      if (v.lang === target + '-' + target.toUpperCase()) { best = v; break; }
    }
  }
  return best;
}

function generateSpeech(text, character) {
  if (!text || !text.trim() || isGenerating) return;
  isGenerating = true;
  generationStatus = 'generating';
  generationAudioUrl = null;
  render();

  var char = character || currentCharacter;
  var lang = char ? char.lang : 'en';
  var rate = char ? (char.rate || 1.0) : 1.0;
  var pitch = char ? (char.pitch || 1.0) : 1.0;

  var voice = findBrowserVoice(lang);
  if (!voice) {
    voice = findBrowserVoice('en');
  }

  var utterance = new SpeechSynthesisUtterance(text);
  if (voice) utterance.voice = voice;
  utterance.rate = rate;
  utterance.pitch = pitch;
  utterance.volume = 1.0;
  utterance.lang = lang;

  utterance.onend = function() {
    generationStatus = 'done';
    isGenerating = false;
    render();
  };
  utterance.onerror = function(e) {
    console.error('Speech error:', e);
    generationStatus = 'error';
    isGenerating = false;
    render();
  };

  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(utterance);

  generationStatus = 'speaking';
  render();
}

function stopSpeech() {
  window.speechSynthesis.cancel();
  isGenerating = false;
  generationStatus = 'stopped';
  render();
}

function generateEdgeTTS(text, voiceId) {
  if (!text || !text.trim() || isGenerating) return;
  isGenerating = true;
  generationStatus = 'generating';
  generationAudioUrl = null;
  render();
  fetch(EDGE_TTS_API + '/tts', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text: text, voice: voiceId || 'en-US-AvaNeural' })
  }).then(function(r) {
    if (!r.ok) throw new Error('TTS failed');
    return r.blob();
  }).then(function(blob) {
    var url = URL.createObjectURL(blob);
    generationAudioUrl = url;
    generationStatus = 'done';
    isGenerating = false;
    render();
    var audio = document.getElementById('gen-audio');
    if (audio) audio.play();
  }).catch(function(e) {
    generationStatus = 'error';
    isGenerating = false;
    alert('Edge TTS failed: ' + e.message);
    render();
  });
}

function selectCharacter(cid) {
  for (var i = 0; i < CHARACTER_VOICES.length; i++) {
    if (CHARACTER_VOICES[i].id === cid) {
      currentCharacter = CHARACTER_VOICES[i];
      generationAudioUrl = null;
      generationStatus = '';
      currentTab = 'generate';
      render();
      return;
    }
  }
}

function clearCharacter() {
  currentCharacter = null;
  generationAudioUrl = null;
  generationStatus = '';
  render();
}

function checkEdgeTTS() {
  return fetch(EDGE_TTS_API + '/voices').then(function(r) {
    if (!r.ok) throw new Error('no');
    return r.json();
  }).then(function(d) {
    edgeTTSVoices = d || {};
    edgeConnected = true;
    render();
  }).catch(function() {
    edgeTTSVoices = {};
    edgeConnected = false;
  });
}

function checkBackend() {
  return fetch(API + '/health').then(function(r) {
    if (!r.ok) throw new Error('no');
    return r.json();
  }).then(function(d) {
    backendConnected = true;
    render();
  }).catch(function() {
    backendConnected = false;
  });
}

function loadWebSpeechVoices() {
  webSpeechVoices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  if (webSpeechVoices.length === 0 && window.speechSynthesis) {
    window.speechSynthesis.onvoiceschanged = function() {
      webSpeechVoices = window.speechSynthesis.getVoices();
    };
  }
}

    + '<h2 class="text-2xl md:text-3xl font-bold mb-2 ' + ct() + '">Open Source Engines</h2>'
    + '<p class="' + cs() + '">Choose the right engine for your use case</p>'
    + '</div>'
    + '<div class="grid md:grid-cols-2 lg:grid-cols-3 gap-3">' + engineCards + '</div>'
    + '</section>'
    + '<section class="py-12 px-4 md:px-6 max-w-3xl mx-auto text-center">'
    + '<div class="' + cb() + ' border rounded-3xl p-8 card-shadow">'
    + '<h2 class="text-xl md:text-2xl font-bold mb-3 ' + ct() + '">Ready to create?</h2>'
    + '<p class="' + cs() + ' mb-5 text-sm">Start generating speech in seconds. Just click a character and type.</p>'
    + '<button onclick="currentView=\'app\';currentTab=\'generate\';render()" class="btn-primary text-base px-8 py-3 rounded-2xl">⚡ Open Studio</button>'
    + '</div>'
    + '</section>'
    + '<footer class="py-6 text-center text-xs ' + cs() + ' border-t ' + (isDark ? 'border-[#262626]' : 'border-surface-200') + '">'
    + 'iknbite — Free & Open Source AI Voice Studio'
    + '</footer>'
    + '</div>';
}

function renderApp() {
  var tabs = [
    {id:'generate',label:'Generate',icon:'⚡'},
    {id:'voices',label:'Voices',icon:'🎤'},
    {id:'transcribe',label:'Transcribe',icon:'📝'},
    {id:'settings',label:'Settings',icon:'⚙️'}
  ];
  var tabHtml = '';
  for (var i = 0; i < tabs.length; i++) {
    var t = tabs[i];
    tabHtml += '<button class="tab-pill ' + (currentTab === t.id ? 'active' : '') + '" onclick="currentTab=\'' + t.id + '\';render()">' + t.icon + ' ' + t.label + '</button>';
  }

  var content = '';
  if (currentTab === 'generate') content = renderGenerate();
  else if (currentTab === 'voices') content = renderVoices();
  else if (currentTab === 'transcribe') content = renderTranscribe();
  else content = renderSettings();

  return renderNav()
    + '<div class="min-h-screen">'
    + '<div class="pt-16 px-4 md:px-6 max-w-5xl mx-auto pb-12">'
    + '<div class="flex items-center gap-1 mb-5 border-b ' + (isDark ? 'border-[#333]' : 'border-surface-200') + ' pb-0 overflow-x-auto">' + tabHtml + '</div>'
    + '<div class="pt-4">' + content + '</div>'
    + '</div></div>';
}

function renderGenerate() {
  var h = '<div class="max-w-2xl mx-auto space-y-4 slide-up">';

  // Character picker
  if (!currentCharacter) {
    h += '<div class="' + cb() + ' border rounded-2xl p-4 card-shadow-sm">';
    h += '<div class="flex items-center justify-between mb-3">';
    h += '<div><h3 class="font-bold text-sm ' + ct() + '">Choose a Character</h3>';
    h += '<p class="text-xs ' + cs() + '">34 voices · speaks instantly in your browser</p></div>';
    if (favorites.length > 0) {
      h += '<span class="text-xs ' + cs() + '">' + favorites.length + ' ★</span>';
    }
    h += '</div>';

    // Language filter
    var langLabels = {all:'All',en:'English',ja:'Japanese',zh:'Chinese',ko:'Korean',fr:'French',es:'Spanish',ar:'Arabic',hi:'Hindi',de:'German',pt:'Portuguese',it:'Italian',ru:'Russian'};
    h += '<div class="flex flex-wrap gap-1 mb-3">';
    for (var lk in langLabels) {
      var isActive = charLangFilter === lk;
      h += '<button onclick="charLangFilter=\'' + lk + '\';render()" class="text-[10px] px-2 py-1 rounded-full font-medium transition ' + (isActive ? 'bg-surface-900 text-white dark:bg-white dark:text-surface-900' : ci() + ' border ' + cs()) + '">' + langLabels[lk] + '</button>';
    }
    h += '</div>';

    h += '<div class="grid grid-cols-4 md:grid-cols-7 lg:grid-cols-9 gap-2">';
    for (var i = 0; i < CHARACTER_VOICES.length; i++) {
      var c = CHARACTER_VOICES[i];
      if (charLangFilter !== 'all' && c.lang !== charLangFilter) continue;
      h += '<button onclick="selectCharacter(\'' + c.id + '\')" class="voice-card flex flex-col items-center gap-1.5 p-2">';
      h += '<div class="w-10 h-10 rounded-xl flex items-center justify-center text-lg text-white font-bold shadow-sm" style="background:linear-gradient(135deg,' + c.color[0] + ',' + c.color[1] + ')">' + c.avatar + '</div>';
      h += '<div class="text-[9px] font-medium ' + cs() + ' text-center truncate w-full">' + c.name + '</div>';
      h += '</button>';
    }
    h += '</div></div>';
  }

  // Active voice card
  h += '<div class="' + cb() + ' border rounded-2xl p-4 card-shadow-sm">';
  if (currentCharacter) {
    h += '<div class="flex items-center gap-3">';
    h += '<div class="w-12 h-12 rounded-2xl flex items-center justify-center text-2xl text-white font-bold shadow-md avatar-ring" style="background:linear-gradient(135deg,' + currentCharacter.color[0] + ',' + currentCharacter.color[1] + ')">' + currentCharacter.avatar + '</div>';
    h += '<div class="flex-1 min-w-0">';
    h += '<div class="flex items-center gap-2"><span class="font-bold text-sm ' + ct() + '">' + currentCharacter.name + '</span>';
    h += '<button onclick="toggleFav(\'' + currentCharacter.id + '\')" class="text-xs">' + (isFav(currentCharacter.id) ? '★' : '☆') + '</button></div>';
    h += '<div class="text-xs ' + cs() + '">' + currentCharacter.desc + ' · ' + (LANGUAGES[currentCharacter.lang] || currentCharacter.lang) + '</div>';
    h += '</div>';
    h += '<button onclick="clearCharacter()" class="text-xs ' + cs() + ' hover:text-red-500 px-2 py-1 rounded-lg hover:bg-red-50 dark:hover:bg-red-900/20 transition">✕</button>';
    h += '</div>';
  } else {
    h += '<div class="flex items-center gap-3">';
    h += '<div class="w-12 h-12 rounded-2xl flex items-center justify-center text-xl bg-surface-100 dark:bg-surface-800">🎙️</div>';
    h += '<div class="flex-1"><div class="font-bold text-sm ' + ct() + '">Browser TTS</div>';
    h += '<div class="text-xs ' + cs() + '">Uses your device\'s built-in voices</div></div>';
    h += '<button onclick="currentTab=\'voices\';render()" class="text-xs text-brand-600 hover:text-brand-700 px-2 py-1 rounded-lg hover:bg-brand-50 dark:hover:bg-brand-900/20 transition">Pick ↑</button>';
    h += '</div>';
  }
  h += '</div>';

  // Text input
  h += '<div class="' + cb() + ' border rounded-2xl p-4 card-shadow-sm">';
  h += '<div class="flex items-center justify-between mb-2">';
  h += '<label class="text-xs font-semibold ' + cs() + ' uppercase tracking-wider">Text to Speak</label>';
  h += '<span class="text-xs ' + cs() + '">' + genText.length.toLocaleString() + ' chars</span>';
  h += '</div>';
  h += '<textarea id="gen-textarea" rows="5" placeholder="Type or paste your text here..." class="w-full ' + ci() + ' border rounded-xl px-4 py-3 text-sm resize-none leading-relaxed" oninput="genText=this.value">' + genText + '</textarea>';
  h += '</div>';

  // Status / Audio
  if (generationStatus === 'generating') {
    h += '<div class="' + cb() + ' border rounded-2xl p-4 card-shadow-sm">';
    h += '<div class="flex items-center gap-3">';
    h += '<div class="gen-wave"><span></span><span></span><span></span><span></span></div>';
    h += '<span class="text-sm font-medium ' + ct() + '">Generating speech...</span>';
    h += '</div></div>';
  } else if (generationStatus === 'speaking') {
    h += '<div class="' + cb() + ' border rounded-2xl p-4 card-shadow-sm">';
    h += '<div class="flex items-center gap-3">';
    h += '<div class="w-8 h-8 rounded-lg bg-emerald-100 dark:bg-emerald-900/30 flex items-center justify-center text-emerald-600 pulse-glow">🔊</div>';
    h += '<div class="flex-1"><span class="text-sm font-medium ' + ct() + '">Speaking now...</span></div>';
    h += '<button onclick="stopSpeech()" class="text-xs font-medium px-3 py-1.5 rounded-lg bg-red-50 text-red-500 dark:bg-red-900/20 dark:text-red-400 transition">⏹ Stop</button>';
    h += '</div></div>';
  } else if (generationStatus === 'done' && generationAudioUrl) {
    h += '<div class="' + cb() + ' border rounded-2xl p-4 card-shadow-sm">';
    h += '<div class="flex items-center gap-3 mb-3">';
    h += '<div class="w-8 h-8 rounded-lg bg-emerald-100 dark:bg-emerald-900/30 flex items-center justify-center text-emerald-600">✓</div>';
    h += '<span class="font-bold text-sm ' + ct() + '">Generated</span>';
    h += '</div>';
    h += '<audio id="gen-audio" controls class="w-full h-10" src="' + generationAudioUrl + '"></audio>';
    h += '<div class="flex gap-2 mt-2">';
    h += '<button onclick="downloadAudio()" class="text-xs font-medium px-3 py-1.5 rounded-lg ' + ci() + ' border hover:opacity-80 transition">⬇ Download</button>';
    h += '<button onclick="generationAudioUrl=null;generationStatus=\'\';render()" class="text-xs font-medium px-3 py-1.5 rounded-lg hover:bg-red-50 dark:hover:bg-red-900/20 text-red-500 transition">✕ Clear</button>';
    h += '</div></div>';
  } else if (generationStatus === 'done' && !generationAudioUrl) {
    h += '<div class="' + cb() + ' border rounded-2xl p-4 card-shadow-sm">';
    h += '<div class="flex items-center gap-3">';
    h += '<div class="w-8 h-8 rounded-lg bg-emerald-100 dark:bg-emerald-900/30 flex items-center justify-center text-emerald-600">✓</div>';
    h += '<span class="text-sm ' + ct() + '">Speech completed</span>';
    h += '</div></div>';
  } else if (generationStatus === 'error') {
    h += '<div class="' + cb() + ' border rounded-2xl p-4 card-shadow-sm">';
    h += '<div class="flex items-center gap-3">';
    h += '<div class="w-8 h-8 rounded-lg bg-red-100 dark:bg-red-900/30 flex items-center justify-center text-red-500">✗</div>';
    h += '<span class="text-sm text-red-500">Generation failed — try again</span>';
    h += '</div></div>';
  }

  // Actions
  h += '<div class="flex flex-wrap gap-2">';
  if (isGenerating) {
    h += '<button disabled class="btn-primary px-6 py-3 rounded-xl text-sm"><div class="gen-wave"><span></span><span></span><span></span><span></span></div></button>';
    h += '<button onclick="stopSpeech()" class="btn-secondary px-5 py-3 rounded-xl text-sm text-red-500">⏹ Stop</button>';
  } else {
    var voiceLabel = currentCharacter ? currentCharacter.name : 'Speak';
    h += '<button onclick="generateSpeech(genText)"' + (!genText.trim() ? ' disabled' : '') + ' class="btn-primary px-6 py-3 rounded-xl text-sm">🔊 ' + voiceLabel + '</button>';
    h += '<button onclick="genText=\'\';generationAudioUrl=null;generationStatus=\'\';render()" class="btn-secondary px-4 py-3 rounded-xl text-sm">Clear</button>';
  }
  h += '</div>';

  h += '</div>';
  return h;
}

function renderVoices() {
  var h = '<div class="max-w-4xl mx-auto space-y-4 slide-up">';

  // Character gallery
  h += '<div class="' + cb() + ' border rounded-2xl p-5 card-shadow-sm">';
  h += '<div class="flex items-center justify-between mb-4">';
  h += '<h3 class="font-bold ' + ct() + '">Character Voices</h3>';
  h += '<span class="text-xs ' + cs() + '">' + CHARACTER_VOICES.length + ' characters · 12 languages</span>';
  h += '</div>';

  var charGroups = {};
  for (var i = 0; i < CHARACTER_VOICES.length; i++) {
    var cv = CHARACTER_VOICES[i];
    var langLabel = LANGUAGES[cv.lang] || cv.lang;
    if (!charGroups[langLabel]) charGroups[langLabel] = [];
    charGroups[langLabel].push(cv);
  }

  for (var gl in charGroups) {
    var chars = charGroups[gl];
    h += '<div class="mb-4">';
    h += '<div class="text-xs font-semibold ' + cs() + ' uppercase tracking-wider mb-2">' + gl + ' <span class="text-[10px] px-1.5 py-0.5 rounded bg-surface-100 dark:bg-surface-800 font-normal">' + chars.length + '</span></div>';
    h += '<div class="grid grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-2">';
    for (var ci = 0; ci < chars.length; ci++) {
      var ch = chars[ci];
      h += '<button onclick="selectCharacter(\'' + ch.id + '\')" class="voice-card flex flex-col items-center gap-2 p-3">';
      h += '<div class="w-12 h-12 rounded-2xl flex items-center justify-center text-xl text-white font-bold" style="background:linear-gradient(135deg,' + ch.color[0] + ',' + ch.color[1] + ')">' + ch.avatar + '</div>';
      h += '<div class="text-[11px] font-medium ' + cs() + ' text-center">' + ch.name + '</div>';
      h += '</button>';
    }
    h += '</div></div>';
  }
  h += '</div>';

  // Browser voices info
  h += '<div class="' + cb() + ' border rounded-2xl p-5 card-shadow-sm">';
  h += '<h3 class="font-bold mb-2 ' + ct() + '">Browser Voices</h3>';
  h += '<p class="text-xs ' + cs() + ' mb-3">Your device has ' + webSpeechVoices.length + ' built-in voices. Characters use the closest matching voice for their language.</p>';
  var langVoices = {};
  for (var vi = 0; vi < webSpeechVoices.length; vi++) {
    var v = webSpeechVoices[vi];
    var shortLang = v.lang.split('-')[0];
    if (!langVoices[shortLang]) langVoices[shortLang] = 0;
    langVoices[shortLang]++;
  }
  h += '<div class="flex flex-wrap gap-2">';
  for (var lk2 in langVoices) {
    h += '<span class="text-[10px] px-2 py-1 rounded-full ' + ci() + ' border ' + cs() + '">' + lk2.toUpperCase() + ': ' + langVoices[lk2] + ' voices</span>';
  }
  h += '</div></div>';

  // Favorites
  if (favorites.length > 0) {
    h += '<div class="' + cb() + ' border rounded-2xl p-5 card-shadow-sm">';
    h += '<h3 class="font-bold mb-3 ' + ct() + '">★ Favorites</h3>';
    h += '<div class="flex flex-wrap gap-2">';
    for (var fi = 0; fi < favorites.length; fi++) {
      var favChar = null;
      for (var fj = 0; fj < CHARACTER_VOICES.length; fj++) {
        if (CHARACTER_VOICES[fj].id === favorites[fi]) { favChar = CHARACTER_VOICES[fj]; break; }
      }
      if (favChar) {
        h += '<button onclick="selectCharacter(\'' + favChar.id + '\')" class="voice-card flex items-center gap-2 p-2">';
        h += '<div class="w-8 h-8 rounded-lg flex items-center justify-center text-sm text-white font-bold" style="background:linear-gradient(135deg,' + favChar.color[0] + ',' + favChar.color[1] + ')">' + favChar.avatar + '</div>';
        h += '<span class="text-xs font-medium ' + ct() + '">' + favChar.name + '</span>';
        h += '</button>';
      }
    }
    h += '</div></div>';
  }

  h += '</div>';
  return h;
}

function renderTranscribe() {
  return '<div class="max-w-xl mx-auto text-center slide-up">'
    + '<div class="' + cb() + ' border rounded-2xl p-8 card-shadow-sm">'
    + '<div class="text-4xl mb-3">📝</div>'
    + '<h3 class="text-lg font-bold mb-2 ' + ct() + '">Speech-to-Text</h3>'
    + '<p class="text-sm ' + cs() + ' mb-5">Upload audio for instant transcription</p>'
    + '<input type="file" id="tf" accept=".wav,.mp3,.m4a,.ogg,.flac,.aac,.webm" class="hidden" onchange="if(this.files[0])doTranscribe(this.files[0])">'
    + '<label for="tf" class="block border-2 border-dashed border-surface-200 dark:border-surface-700 rounded-2xl p-8 cursor-pointer hover:border-brand-300 hover:bg-brand-50/50 dark:hover:bg-brand-900/10 transition">'
    + '<div class="' + cs() + '">'
    + '<div class="text-3xl mb-2">📁</div>'
    + '<p class="text-sm">Click to upload audio</p>'
    + '<p class="text-xs text-surface-300 mt-1">WAV, MP3, M4A, OGG, FLAC, AAC, WebM</p>'
    + '</div></label></div></div>';
}

function doTranscribe(file) {
  isGenerating = true;
  render();
  var fd = new FormData();
  fd.append('file', file);
  fetch(API + '/transcribe', { method: 'POST', body: fd }).then(function(r) {
    if (!r.ok) throw new Error('Failed');
    return r.json();
  }).then(function(d) {
    genText = d.text || '';
    currentTab = 'generate';
    isGenerating = false;
    render();
  }).catch(function(e) {
    alert('Transcription requires the Voicebox backend running locally.\n\nStart it with: python -m backend.main');
    isGenerating = false;
    render();
  });
}

function renderSettings() {
  var h = '<div class="max-w-lg mx-auto space-y-4 slide-up">';

  h += '<div class="' + cb() + ' border rounded-2xl p-5 card-shadow-sm">';
  h += '<h3 class="font-bold mb-2 ' + ct() + '">Edge TTS Server <span class="text-xs font-normal text-emerald-600 dark:text-emerald-400">Optional</span></h3>';
  h += '<p class="text-xs ' + cs() + ' mb-3">For higher quality voices, run the Edge TTS server locally</p>';
  h += '<input id="edge-url" value="' + EDGE_TTS_API + '" class="w-full ' + ci() + ' border rounded-xl px-4 py-2.5 text-sm font-mono mb-2">';
  h += '<button onclick="EDGE_TTS_API=document.getElementById(\'edge-url\').value;localStorage.setItem(\'iknbite_edge_tts_url\',EDGE_TTS_API);checkEdgeTTS()" class="btn-secondary px-4 py-2 rounded-xl text-sm">Reconnect</button>';
  h += '</div>';

  h += '<div class="' + cb() + ' border rounded-2xl p-5 card-shadow-sm">';
  h += '<h3 class="font-bold mb-2 ' + ct() + '">Voicebox Backend <span class="text-xs font-normal ' + cs() + '">Optional</span></h3>';
  h += '<p class="text-xs ' + cs() + ' mb-3">Advanced TTS engines (Kokoro, Chatterbox, etc.)</p>';
  h += '<input id="api-url" value="' + API + '" class="w-full ' + ci() + ' border rounded-xl px-4 py-2.5 text-sm font-mono mb-2">';
  h += '<button onclick="API=document.getElementById(\'api-url\').value;localStorage.setItem(\'iknbite_api_url\',API);checkBackend()" class="btn-secondary px-4 py-2 rounded-xl text-sm">Reconnect</button>';
  h += '</div>';

  h += '<div class="' + cb() + ' border rounded-2xl p-5 card-shadow-sm">';
  h += '<h3 class="font-bold mb-2 ' + ct() + '">Status</h3>';
  h += '<div class="space-y-2 text-sm">';
  h += '<div class="flex justify-between"><span class="' + cs() + '">Browser TTS</span><span class="flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-emerald-500"></span>Always ready</span></div>';
  h += '<div class="flex justify-between"><span class="' + cs() + '">Edge TTS</span><span class="flex items-center gap-2"><span class="w-2 h-2 rounded-full ' + (edgeConnected ? 'bg-emerald-500' : 'bg-surface-300') + '"></span>' + (edgeConnected ? 'Connected' : 'Not connected') + '</span></div>';
  h += '<div class="flex justify-between"><span class="' + cs() + '">Voicebox</span><span class="flex items-center gap-2"><span class="w-2 h-2 rounded-full ' + (backendConnected ? 'bg-emerald-500' : 'bg-surface-300') + '"></span>' + (backendConnected ? 'Connected' : 'Not connected') + '</span></div>';
  h += '<div class="flex justify-between"><span class="' + cs() + '">Web Speech Voices</span><span>' + webSpeechVoices.length + ' available</span></div>';
  h += '</div></div>';

  h += '<div class="' + cb() + ' border rounded-2xl p-5 card-shadow-sm">';
  h += '<h3 class="font-bold mb-2 ' + ct() + '">About</h3>';
  h += '<p class="text-sm ' + cs() + '">iknbite is a free, open-source AI Voice Studio. Browser TTS works instantly without any server.</p>';
  h += '<p class="text-xs ' + cs() + ' mt-2"><a href="https://github.com/gsops00/iknbite.github.io" target="_blank" class="text-brand-600 hover:underline">View on GitHub →</a></p>';
  h += '</div>';

  h += '</div>';
  return h;
}

function downloadAudio() {
  if (!generationAudioUrl) return;
  var a = document.createElement('a');
  a.href = generationAudioUrl;
  a.download = 'iknbite-speech.mp3';
  a.click();
}

// Init
applyTheme();
loadWebSpeechVoices();
render();
checkEdgeTTS();
checkBackend();
</script>
</body>
</html>
