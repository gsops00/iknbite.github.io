    .cs{box-shadow:0 0 0 1px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04),0 2px 4px rgba(0,0,0,.04)}
    textarea:focus,input:focus,select:focus{outline:none;box-shadow:0 0 0 2px #4c6ef5}
    .tab-pill{padding:8px 20px;border-radius:10px;font-weight:500;font-size:14px;color:#737373;cursor:pointer;transition:all .2s;border:none;background:none}
    .tab-pill:hover{background:#f5f5f5;color:#171717}
    .tab-pill.active{background:#0f0e0d;color:white}
    .dark .tab-pill:hover{background:#404040;color:#e5e5e5}
    .dark .tab-pill.active{background:#e5e5e5;color:#0f0e0d}
    .fade-in{animation:fadeIn .3s ease-out}
    @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes pulse-ring{0%,100%{box-shadow:0 0 0 0 rgba(76,110,245,.4)}50%{box-shadow:0 0 0 8px rgba(76,110,245,0)}}
    .pulse-ring{animation:pulse-ring 2s infinite}
    @keyframes wave{0%,100%{height:4px}50%{height:18px}}
    .wave span{display:inline-block;width:3px;background:#4c6ef5;border-radius:2px;margin:0 1px;animation:wave .8s ease-in-out infinite}
    .wave span:nth-child(2){animation-delay:.1s}.wave span:nth-child(3){animation-delay:.2s}.wave span:nth-child(4){animation-delay:.3s}
    @keyframes wb{0%,100%{height:4px}50%{height:20px}}
    .wb{animation:wb 1s ease-in-out infinite;width:3px;border-radius:2px}
  </style>
</head>

var L={en:'English',ja:'Japanese',zh:'Chinese',ko:'Korean',fr:'French',es:'Spanish',de:'German',ru:'Russian',ar:'Arabic',hi:'Hindi',pt:'Portuguese',it:'Italian'};
var LC={en:'en',ja:'ja',zh:'zh-CN',ko:'ko',fr:'fr',es:'es',de:'de',ru:'ru',ar:'ar',hi:'hi',pt:'pt',it:'it'};

function dk(){return D?'dark':''}
function bg1(){return D?'bg-[#1a1a1a] border-[#333]':'bg-white border-gray-200'}
function tx(){return D?'text-white':'text-gray-900'}
function ts(){return D?'text-gray-400':'text-gray-500'}
function inp(){return D?'bg-[#262626] border-[#404040]':'bg-gray-50 border-gray-200'}

function applyTheme(){D?document.documentElement.classList.add('dark'):document.documentElement.classList.remove('dark')}
function togDark(){D=!D;localStorage.setItem('iknbite_dark',D);applyTheme();render()}
function togFav(id){var i=FAVS.indexOf(id);if(i>=0)FAVS.splice(i,1);else FAVS.push(id);localStorage.setItem('iknbite_favs',JSON.stringify(FAVS));render()}
function isFav(id){return FAVS.indexOf(id)>=0}

function pickChar(id){
  for(var i=0;i<CHARS.length;i++){
    if(CHARS[i].id===id){
      CHAR=CHARS[i];
      GEN_STATUS='';
      TAB='generate';
      render();
      return;
    }
  }
}

function clearChar(){CHAR=null;GEN_STATUS='';render()}

function stopAudio(){
  if(CUR_AUDIO){CUR_AUDIO.pause();CUR_AUDIO.currentTime=0;CUR_AUDIO=null}
  if(window.speechSynthesis)window.speechSynthesis.cancel();
  GEN_STATUS='';render()
}

function genSpeech(text){
  if(!text||!text.trim())return;
  stopAudio();
  GEN_STATUS='loading';
  render();
  var lang=CHAR?CHAR.l:'en';
  var langCode=LC[lang]||lang||'en';
  var url='https://translate.google.com/translate_tts?ie=UTF-8&tl='+encodeURIComponent(langCode)+'&client=tw-ob&q='+encodeURIComponent(text);
  var audio=new Audio();
  CUR_AUDIO=audio;
  audio.src=url;
  audio.oncanplay=function(){GEN_STATUS='playing';render()};
  audio.onended=function(){GEN_STATUS='done';CUR_AUDIO=null;render()};
  audio.onerror=function(){GEN_STATUS='error';CUR_AUDIO=null;render()};
  audio.play().catch(function(){GEN_STATUS='error';CUR_AUDIO=null;render()});
}

function render(){
  applyTheme();
  var el=document.getElementById('app');
  if(VIEW==='landing')el.innerHTML=landing();
  else el.innerHTML=appView();
  // Attach click handlers via delegation
  document.querySelectorAll('[data-pick]').forEach(function(btn){
    btn.onclick=function(){pickChar(this.getAttribute('data-pick'))};
  });
}

function nav(){
  var nb=D?'bg-[#0f0f0f]/90 border-[#262626]':'bg-white/80 border-gray-200';
  return '<nav class="fixed top-0 left-0 right-0 z-50 backdrop-blur-xl border-b '+nb+'"><div class="max-w-6xl mx-auto px-4 md:px-6 h-14 flex items-center justify-between"><div class="flex items-center gap-2 cursor-pointer" onclick="VIEW=\'landing\';render()"><span class="text-xl">🎙️</span><span class="font-bold text-lg '+tx()+'">iknbite</span><span class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 dark:bg-emerald-900/30 dark:text-emerald-400">FREE</span></div><div class="flex items-center gap-2"><button onclick="togDark()" class="w-8 h-8 rounded-lg flex items-center justify-center hover:bg-gray-100 dark:hover:bg-gray-800 transition text-base">'+(D?'☀️':'🌙')+'</button><a href="https://github.com/gsops00/iknbite.github.io" target="_blank" class="w-8 h-8 rounded-lg flex items-center justify-center hover:bg-gray-100 dark:hover:bg-gray-800 transition text-base">⭐</a></div></div></nav>';
}

function landing(){

    {i:'🌐',n:'Google TTS',d:'Free online neural voices — works instantly',b:'Online',cl:'emerald'},

    {i:'🔥',n:'Qwen3-TTS',d:'High quality, voice cloning (self-hosted)',b:'Quality',cl:'red'},
    {i:'💎',n:'LuxTTS',d:'48kHz audio (self-hosted)',b:'Pro',cl:'cyan'}
  ];
  var ec='';for(var e=0;e<engs.length;e++){var g=engs[e];ec+='<div class="'+bg1()+' rounded-2xl p-5 cs"><div class="flex items-center gap-3 mb-2"><span class="text-2xl">'+g.i+'</span><div><div class="font-bold text-sm '+tx()+'">'+g.n+'</div><span class="text-[10px] font-semibold px-1.5 py-0.5 rounded bg-'+g.cl+'-100 text-'+g.cl+'-700 dark:bg-'+g.cl+'-900/30 dark:text-'+g.cl+'-400">'+g.b+'</span></div></div><p class="text-xs '+ts()+' leading-relaxed">'+g.d+'</p></div>';}
  var stats=[{v:'6',l:'TTS Engines'},{v:'12',l:'Languages'},{v:'34',l:'Characters'},{v:'$0',l:'API Keys'}];
  var sc='';for(var s=0;s<stats.length;s++){sc+='<div class="'+bg1()+' rounded-2xl p-4 cs text-center"><div class="text-2xl md:text-3xl font-black '+tx()+'">'+stats[s].v+'</div><div class="text-[10px] md:text-xs '+ts()+' mt-1 uppercase tracking-wider">'+stats[s].l+'</div></div>';}
  return nav()+'<div class="min-h-screen"><section class="pt-24 pb-12 px-4 md:px-6 max-w-5xl mx-auto text-center fade-in"><div class="inline-flex items-center gap-2 '+bg1()+' border rounded-full px-4 py-2 mb-6 text-sm '+ts()+' cs"><span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>Works Online — No Installation Needed</div><h1 class="text-4xl md:text-7xl font-black tracking-tight mb-4 leading-tight '+tx()+'">AI Voice Studio<br><span class="bg-gradient-to-r from-brand-600 via-purple-500 to-pink-500 bg-clip-text text-transparent">For Everyone</span></h1><p class="text-base md:text-lg '+ts()+' max-w-xl mx-auto mb-8">Generate natural speech in 12 languages with 34 character voices.<br>No sign-up. No API keys. Just click and speak.</p><div class="flex items-center justify-center gap-3 mb-12"><button onclick="VIEW=\'app\';TAB=\'generate\';render()" class="bg-gray-900 dark:bg-white text-white dark:text-gray-900 px-8 py-3.5 rounded-2xl font-semibold text-base hover:opacity-90 transition">⚡ Start Generating</button><a href="#engines" class="bg-white dark:bg-[#1a1a1a] text-gray-900 dark:text-white px-8 py-3.5 rounded-2xl font-semibold text-base border border-gray-200 dark:border-[#333] hover:bg-gray-50 dark:hover:bg-[#262626] transition">See Engines ↓</a></div><div class="grid grid-cols-2 md:grid-cols-4 gap-3 max-w-2xl mx-auto">'+sc+'</div></section><div class="flex items-end justify-center gap-1 h-10 mb-12 opacity-30 overflow-hidden">'+wf+'</div><section id="engines" class="py-12 px-4 md:px-6 max-w-5xl mx-auto"><div class="text-center mb-8"><h2 class="text-2xl md:text-3xl font-bold mb-2 '+tx()+'">Open Source Engines</h2><p class="'+ts()+'">Choose the right engine for your use case</p></div><div class="grid md:grid-cols-2 lg:grid-cols-3 gap-3">'+ec+'</div></section><section class="py-12 px-4 md:px-6 max-w-3xl mx-auto text-center"><div class="'+bg1()+' border rounded-3xl p-8 cs"><h2 class="text-xl md:text-2xl font-bold mb-3 '+tx()+'">Ready to create?</h2><p class="'+ts()+' mb-5 text-sm">Start generating speech in seconds.</p><button onclick="VIEW=\'app\';TAB=\'generate\';render()" class="bg-gray-900 dark:bg-white text-white dark:text-gray-900 px-8 py-3.5 rounded-2xl font-semibold text-base hover:opacity-90 transition">⚡ Open Studio</button></div></section><footer class="py-6 text-center text-xs '+ts()+' border-t '+(D?'border-[#262626]':'border-gray-200')+'">iknbite — Free & Open Source AI Voice Studio</footer></div>';
}

function appView(){
  var tabs=[{id:'generate',l:'Generate',i:'⚡'},{id:'voices',l:'Voices',i:'🎤'},{id:'settings',l:'Settings',i:'⚙️'}];
  var th='';for(var i=0;i<tabs.length;i++){var t=tabs[i];th+='<button class="tab-pill '+(TAB===t.id?'active':'')+'" onclick="TAB=\''+t.id+'\';render()">'+t.i+' '+t.l+'</button>';}
  var content='';
  if(TAB==='generate')content=genPage();
  else if(TAB==='voices')content=voicesPage();
  else content=settingsPage();
  return nav()+'<div class="min-h-screen"><div class="pt-16 px-4 md:px-6 max-w-5xl mx-auto pb-12"><div class="flex items-center gap-1 mb-5 border-b '+(D?'border-[#333]':'border-gray-200')+' pb-0 overflow-x-auto">'+th+'</div><div class="pt-4">'+content+'</div></div></div>';
}

function charGrid(){
  var ll={all:'All',en:'English',ja:'Japanese',zh:'Chinese',ko:'Korean',fr:'French',es:'Spanish',ar:'Arabic',hi:'Hindi',de:'German',pt:'Portuguese',it:'Italian',ru:'Russian'};
  var fh='<div class="flex flex-wrap gap-1 mb-3">';
  for(var k in ll){
    var act=LANG_F===k;
    fh+='<button onclick="LANG_F=\''+k+'\';render()" style="font-size:10px;padding:2px 8px;border-radius:9999px;font-weight:500;cursor:pointer;border:1px solid '+(D?'#404040':'#e5e5e5')+';background:'+(act?(D?'#fff':'#111'):(D?'#262626':'#fff'))+';color:'+(act?(D?'#111':'#fff'):(D?'#a3a3a3':'#737373'))+'">'+ll[k]+'</button>';
  }
  fh+='</div>';

  var grid='<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">';
  for(var i=0;i<CHARS.length;i++){
    var c=CHARS[i];
    if(LANG_F!=='all'&&c.l!==LANG_F)continue;
    grid+='<div data-pick="'+c.id+'" style="cursor:pointer;text-align:center;padding:8px;border-radius:12px;border:1px solid '+(D?'#333':'#e5e5e5')+';background:'+(D?'#1a1a1a':'#fff')+'" onmouseover="this.style.transform=\'translateY(-2px)\';this.style.boxShadow=\'0 4px 12px rgba(0,0,0,0.1)\'" onmouseout="this.style.transform=\'\';this.style.boxShadow=\'\'">';
    grid+='<div style="width:44px;height:44px;border-radius:12px;margin:0 auto 4px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;font-weight:700;background:linear-gradient(135deg,'+c.c[0]+','+c.c[1]+')">'+c.a+'</div>';
    grid+='<div style="font-size:10px;font-weight:500;color:'+(D?'#a3a3a3':'#737373')+'">'+c.n+'</div>';
    grid+='</div>';
  }
  grid+='</div>';
  return fh+grid;
}

function genPage(){
  var h='<div style="max-width:640px;margin:0 auto" class="space-y-4 fade-in">';

  // Character picker
  if(!CHAR){
    h+='<div class="'+bg1()+' border rounded-2xl p-4 cs">';
    h+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px"><div><h3 style="font-weight:700;font-size:14px" class="'+tx()+'">Choose a Character</h3><p style="font-size:11px" class="'+ts()+'">34 voices · speaks online instantly</p></div></div>';
    h+=charGrid();
    h+='</div>';
  }

  // Active voice card
  h+='<div class="'+bg1()+' border rounded-2xl p-4 cs">';
  if(CHAR){
    h+='<div style="display:flex;align-items:center;gap:12px">';

    h+='<div style="flex:1;min-width:0"><div style="display:flex;align-items:center;gap:6px"><span style="font-weight:700;font-size:14px" class="'+tx()+'">'+CHAR.n+'</span><button onclick="togFav(\''+CHAR.id+'\')" style="font-size:12px;border:none;background:none;cursor:pointer">'+(isFav(CHAR.id)?'★':'☆')+'</button></div><div style="font-size:11px" class="'+ts()+'">'+CHAR.d+' · '+(L[CHAR.l]||CHAR.l)+'</div></div>';
    h+='<button onclick="clearChar()" style="font-size:11px;border:none;background:none;cursor:pointer;padding:4px 8px;border-radius:8px;color:'+(D?'#a3a3a3':'#737373')+'">✕ Change</button>';
    h+='</div>';
  } else {
    h+='<div style="display:flex;align-items:center;gap:12px">';
    h+='<div style="width:48px;height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:20px;background:'+(D?'#262626':'#f5f5f5')+'">🎙️</div>';

    h+='</div>';
  }
  h+='</div>';

  // Text input
  h+='<div class="'+bg1()+' border rounded-2xl p-4 cs">';
  h+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px"><label style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em" class="'+ts()+'">Text to Speak</label><span style="font-size:11px" class="'+ts()+'">'+TXT.length.toLocaleString()+' chars</span></div>';
  h+='<textarea id="txt" rows="5" placeholder="Type or paste your text here..." style="width:100%;resize:none;padding:12px;border-radius:12px;font-size:14px;line-height:1.6" class="'+inp()+' border" oninput="TXT=this.value">'+TXT+'</textarea>';
  h+='</div>';

  // Status
  if(GEN_STATUS==='loading'){
    h+='<div class="'+bg1()+' border rounded-2xl p-4 cs"><div style="display:flex;align-items:center;gap:12px"><div class="wave"><span></span><span></span><span></span><span></span></div><span style="font-size:14px;font-weight:500" class="'+tx()+'">Loading audio...</span></div></div>';
  }else if(GEN_STATUS==='playing'){
    h+='<div class="'+bg1()+' border rounded-2xl p-4 cs"><div style="display:flex;align-items:center;gap:12px"><div style="width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:#d1fae5;color:#059669" class="pulse-ring">🔊</div><span style="font-size:14px;font-weight:500;flex:1" class="'+tx()+'">Speaking now...</span><button onclick="stopAudio()" style="font-size:12px;font-weight:500;padding:6px 12px;border-radius:8px;background:#fef2f2;color:#ef4444;border:none;cursor:pointer">⏹ Stop</button></div></div>';
  }else if(GEN_STATUS==='done'){
    h+='<div class="'+bg1()+' border rounded-2xl p-4 cs"><div style="display:flex;align-items:center;gap:12px"><div style="width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:#d1fae5;color:#059669">✓</div><span style="font-size:14px" class="'+tx()+'">Speech completed</span></div></div>';
  }else if(GEN_STATUS==='error'){
    h+='<div class="'+bg1()+' border rounded-2xl p-4 cs"><div style="display:flex;align-items:center;gap:12px"><div style="width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:#fef2f2;color:#ef4444">✗</div><span style="font-size:14px;color:#ef4444">Generation failed — try again</span></div></div>';
  }

  // Buttons
  h+='<div style="display:flex;gap:8px;flex-wrap:wrap">';
  if(GEN_STATUS==='loading'||GEN_STATUS==='playing'){
    h+='<button disabled style="opacity:.5;cursor:not-allowed;padding:10px 24px;border-radius:12px;font-weight:600;font-size:14px;background:#0f0e0d;color:white;border:none">Generating...</button>';
    h+='<button onclick="stopAudio()" style="padding:10px 24px;border-radius:12px;font-weight:600;font-size:14px;background:white;color:#ef4444;border:1px solid #e5e5e5;cursor:pointer">⏹ Stop</button>';
  }else{
    var lbl=CHAR?CHAR.n:'Speak';
    h+='<button onclick="genSpeech(TXT)" style="padding:10px 24px;border-radius:12px;font-weight:600;font-size:14px;background:#0f0e0d;color:white;border:none;cursor:pointer;'+(!TXT.trim()?'opacity:.5;cursor:not-allowed':'')+'"'+(!TXT.trim()?' disabled':'')+'>🔊 '+lbl+'</button>';
    h+='<button onclick="TXT=\'\';GEN_STATUS=\'\';render()" style="padding:10px 24px;border-radius:12px;font-weight:600;font-size:14px;background:white;color:#0f0e0d;border:1px solid #e5e5e5;cursor:pointer">Clear</button>';
  }
  h+='</div>';

  h+='</div>';
  return h;
}

function voicesPage(){
  var h='<div style="max-width:800px;margin:0 auto" class="space-y-4 fade-in">';
  h+='<div class="'+bg1()+' border rounded-2xl p-5 cs">';
  h+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px"><h3 style="font-weight:700" class="'+tx()+'">Character Voices</h3><span style="font-size:12px" class="'+ts()+'">'+CHARS.length+' characters · 12 languages</span></div>';
  var groups={};
  for(var i=0;i<CHARS.length;i++){var cv=CHARS[i];var ll=L[cv.l]||cv.l;if(!groups[ll])groups[ll]=[];groups[ll].push(cv);}
  for(var gl in groups){
    var chs=groups[gl];
    h+='<div style="margin-bottom:16px">';
    h+='<div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px" class="'+ts()+'">'+gl+' <span style="font-size:10px;padding:1px 6px;border-radius:4px;background:'+(D?'#262626':'#f5f5f5')+';font-weight:400">'+chs.length+'</span></div>';
    h+='<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">';
    for(var ci=0;ci<chs.length;ci++){
      var ch=chs[ci];
      h+='<div data-pick="'+ch.id+'" style="cursor:pointer;text-align:center;padding:12px;border-radius:16px;border:1px solid '+(D?'#333':'#e5e5e5')+';background:'+(D?'#1a1a1a':'#fff')+'" onmouseover="this.style.transform=\'translateY(-2px)\';this.style.boxShadow=\'0 4px 12px rgba(0,0,0,0.1)\'" onmouseout="this.style.transform=\'\';this.style.boxShadow=\'\'">';
      h+='<div style="width:48px;height:48px;border-radius:16px;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;font-weight:700;background:linear-gradient(135deg,'+ch.c[0]+','+ch.c[1]+')">'+ch.a+'</div>';
      h+='<div style="font-size:11px;font-weight:500" class="'+ts()+'">'+ch.n+'</div>';
      h+='</div>';
    }
    h+='</div></div>';
  }
  h+='</div>';

  if(FAVS.length>0){
    h+='<div class="'+bg1()+' border rounded-2xl p-5 cs">';
    h+='<h3 style="font-weight:700;margin-bottom:12px" class="'+tx()+'">★ Favorites</h3>';
    h+='<div style="display:flex;flex-wrap:wrap;gap:8px">';
    for(var fi=0;fi<FAVS.length;fi++){
      var fc=null;for(var fj=0;fj<CHARS.length;fj++){if(CHARS[fj].id===FAVS[fi]){fc=CHARS[fj];break;}}
      if(fc){
        h+='<div data-pick="'+fc.id+'" style="cursor:pointer;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;border:1px solid '+(D?'#333':'#e5e5e5')+';background:'+(D?'#1a1a1a':'#fff')+'">';
        h+='<div style="width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;font-weight:700;background:linear-gradient(135deg,'+fc.c[0]+','+fc.c[1]+')">'+fc.a+'</div>';
        h+='<span style="font-size:12px;font-weight:500" class="'+tx()+'">'+fc.n+'</span></div>';
      }
    }
    h+='</div></div>';
  }

  h+='</div>';
  return h;
}

function settingsPage(){
  var h='<div style="max-width:560px;margin:0 auto" class="space-y-4 fade-in">';
  h+='<div class="'+bg1()+' border rounded-2xl p-5 cs"><h3 style="font-weight:700;margin-bottom:8px" class="'+tx()+'">TTS Engine</h3><p style="font-size:12px;margin-bottom:12px" class="'+ts()+'">Google Translate TTS is used by default — free, online, no setup needed.</p><div style="font-size:14px" class="space-y-2"><div style="display:flex;justify-content:space-between"><span class="'+ts()+'">Google TTS</span><span style="display:flex;align-items:center;gap:8px"><span style="width:8px;height:8px;border-radius:50%;background:#10b981"></span>Active</span></div><div style="display:flex;justify-content:space-between"><span class="'+ts()+'">Voices</span><span>'+CHARS.length+' characters · 12 languages</span></div><div style="display:flex;justify-content:space-between"><span class="'+ts()+'">API Keys</span><span>None needed</span></div></div></div>';
  h+='<div class="'+bg1()+' border rounded-2xl p-5 cs"><h3 style="font-weight:700;margin-bottom:8px" class="'+tx()+'">How It Works</h3><ul style="font-size:12px;list-style:none;padding:0" class="'+ts()+'"><li style="margin-bottom:6px">1. Pick a character voice from the grid</li><li style="margin-bottom:6px">2. Type or paste your text</li><li style="margin-bottom:6px">3. Click the generate button</li><li style="margin-bottom:6px">4. Audio plays instantly from Google TTS</li><li>5. Each character uses the matching language voice</li></ul></div>';
  h+='<div class="'+bg1()+' border rounded-2xl p-5 cs"><h3 style="font-weight:700;margin-bottom:8px" class="'+tx()+'">About</h3><p style="font-size:14px" class="'+ts()+'">iknbite is a free, open-source AI Voice Studio. Speech generation uses Google Translate TTS — completely free, no API key or sign-up required.</p><p style="font-size:12px;margin-top:8px" class="'+ts()+'"><a href="https://github.com/gsops00/iknbite.github.io" target="_blank" style="color:#4c6ef5;text-decoration:underline">View on GitHub →</a></p></div>';
  h+='</div>';
  return h;
}
