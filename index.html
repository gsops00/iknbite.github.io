<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>iknbite — Neon Snake Arcade</title>
    <meta name="description" content="iknbite — a fast, neon snake arcade game. Eat, grow, and beat your high score." />
    <link rel="canonical" href="https://iknbite.com/" />
    <meta name="robots" content="index, follow" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐍</text></svg>" />
    <script type="module" crossorigin src="/assets/index-DPSSkFVl.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DYFpANvX.css">
  </head>
  <body>
    <div id="app">
      <div id="game-root"></div>
      <div id="hud" class="hidden">
        <div class="hud-left">
          <span class="brand">iknbite</span>
        </div>
        <div class="hud-right">
          <div class="stat"><span class="stat-label">score</span><span id="score" class="stat-value">0</span></div>
          <div class="stat"><span class="stat-label">best</span><span id="best" class="stat-value">0</span></div>
        </div>
      </div>
      <div id="menu" class="overlay">
        <div class="panel">
          <h1>iknbite</h1>
          <p class="tagline">a neon snake arcade</p>
          <div class="controls">
            <span>⬆⬇⬅➡ / WASD</span>
            <span>or swipe on mobile</span>
          </div>
          <button id="start-btn" class="btn">play</button>
        </div>
      </div>
      <div id="gameover" class="overlay hidden">
        <div class="panel">
          <h1 id="gameover-title">game over</h1>
          <p class="tagline">score <span id="final-score">0</span> · best <span id="final-best">0</span></p>
          <button id="restart-btn" class="btn">play again</button>
        </div>
      </div>
    </div>
  </body>
</html>
