<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>iknbite — AI Voice Studio</title>
  <meta name="description" content="Free, open-source AI voice studio. Generate natural speech in 28+ voices across 12 languages. No API keys needed.">
  <meta name="theme-color" content="#4c6ef5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎙️</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Manrope:wght@300;400;500;600;700;800&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="light">
  <!-- App renders here -->
  <script src="js/avatars.js"></script>
  <script src="js/features.js"></script>
  <script src="js/voices.js"></script>
  <script src="js/chatbot.js"></script>
  <script src="js/tts.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      gsap.registerPlugin(ScrollTrigger);
      // Scroll reveal for [data-reveal] elements
      document.querySelectorAll('[data-reveal]').forEach(function(el) {
        gsap.from(el, {
          opacity: 0, y: 16, duration: 0.5,
          ease: 'power1.out',
          scrollTrigger: { trigger: el, start: 'top 92%', toggleActions: 'play none none reverse' }
        });
      });
      // Stagger reveal for grid items
      document.querySelectorAll('.anim-stagger').forEach(function(container) {
        var items = container.children;
        gsap.from(items, {
          opacity: 0, y: 12, duration: 0.35, stagger: 0.04,
          ease: 'power1.out',
          scrollTrigger: { trigger: container, start: 'top 90%', toggleActions: 'play none none reverse' }
        });
      });
    });
  </script>
</body>
</html>
