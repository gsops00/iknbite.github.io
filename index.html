<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iknbite — AI Voice Studio</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎙️</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            ink: { 50: '#f0f0ff', 100: '#e0e0ff', 200: '#c4b5fd', 300: '#a78bfa', 400: '#8b5cf6', 500: '#7c3aed', 600: '#6d28d9', 700: '#5b21b6', 800: '#4c1d95', 900: '#2e1065', 950: '#1a0533' },
            neon: { blue: '#00d4ff', pink: '#ff006e', green: '#00ff88', orange: '#ff8800' }
          },
          fontFamily: { sans: ['Space Grotesk', 'system-ui', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] }
        }
      }
    }
  </script>
  <style>
    * { scrollbar-width: thin; scrollbar-color: #4c1d95 #1a0533; }
    ::selection { background: #7c3aed44; }
    body { font-family: 'Space Grotesk', system-ui, sans-serif; }
    .glass { background: rgba(30, 10, 60, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(139, 92, 246, 0.2); }
    .glow-blue { box-shadow: 0 0 30px rgba(0, 212, 255, 0.3); }
    .glow-pink { box-shadow: 0 0 30px rgba(255, 0, 110, 0.3); }
    .glow-green { box-shadow: 0 0 30px rgba(0, 255, 136, 0.3); }
    .text-gradient { background: linear-gradient(135deg, #00d4ff, #7c3aed, #ff006e); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .hover-glow { transition: all 0.2s; }
    .hover-glow:hover { box-shadow: 0 0 40px rgba(139, 92, 246, 0.4); border-color: rgba(139, 92, 246, 0.6); transform: translateY(-2px); }
    .tab-active { background: linear-gradient(135deg, rgba(139, 92, 246, 0.3), rgba(0, 212, 255, 0.1)); border-color: rgba(139, 92, 246, 0.6); }
    .slide-up { animation: slideUp 0.5s ease-out; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    .animate-spin { animation: spin 1s linear infinite; }
    textarea:focus, input:focus, select:focus { outline: none; box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.5); }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .status-connected { background: #00ff88; box-shadow: 0 0 10px #00ff88; }
    .status-disconnected { background: #ff006e; box-shadow: 0 0 10px #ff006e; }
    .status-loading { background: #ff8800; box-shadow: 0 0 10px #ff8800; animation: pulse 1s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .hidden { display: none !important; }
    .noise { background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E"); }
  </style>
</head>
<body class="bg-ink-950 text-white min-h-screen noise">
  <!-- Background orbs -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden -z-10">
    <div class="absolute -top-40 -right-40 w-96 h-96 bg-ink-500/10 rounded-full blur-3xl"></div>
    <div class="absolute top-1/2 -left-40 w-96 h-96 bg-neon-blue/5 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-40 right-1/3 w-96 h-96 bg-neon-pink/5 rounded-full blur-3xl"></div>
  </div>

  <!-- Navbar -->
  <nav class="glass fixed top-0 left-0 right-0 z-50 px-6 py-3">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-neon-blue to-ink-500 flex items-center justify-center text-lg">🎙️</div>
        <span class="text-xl font-bold tracking-tight">iknbite</span>
        <span class="text-xs text-ink-300 font-mono bg-ink-900/50 px-2 py-0.5 rounded">v1.0</span>
      </div>
      <div class="flex items-center gap-1" id="nav-tabs"></div>
    </div>
  </nav>

  <!-- Connection banner -->
  <div id="conn-banner" class="fixed top-16 left-0 right-0 z-40 px-6 hidden">
    <div class="max-w-7xl mx-auto">
      <div class="glass rounded-xl px-4 py-3 flex items-center gap-3 border border-neon-pink/30">
        <span class="status-dot status-disconnected"></span>
        <span class="text-sm text-ink-300">Not connected to backend. Go to <button onclick="switchTab('settings')" class="text-neon-blue underline">Settings</button> to configure.</span>
      </div>
    </div>
  </div>

  <!-- Main -->
  <main id="content" class="max-w-4xl mx-auto px-6 pt-24 pb-20"></main>

  <!-- Footer -->
  <footer class="fixed bottom-0 left-0 right-0 glass border-t border-ink-800/50 px-6 py-3 z-40">
    <div class="max-w-7xl mx-auto flex items-center justify-between text-xs text-ink-500">
      <span>iknbite.com — AI Voice Studio</span>
      <div class="flex items-center gap-3">
        <span id="footer-status-dot" class="status-dot status-disconnected"></span>
        <span id="footer-status-text">Disconnected</span>
      </div>
    </div>
  </footer>

<script>
const API = localStorage.getItem('iknbite_api_url') || 'http://localhost:17493';
let currentTab = 'generate';
let health = null;
let profiles = [];
let history = [];

const tabs = [
  { id: 'generate', label: 'Generate', icon: '⚡' },
  { id: 'voices', label: 'Voices', icon: '🎭' },
  { id: 'transcribe', label: 'Transcribe', icon: '📝' },
  { id: 'history', label: 'History', icon: '📚' },
  { id: 'settings', label: 'Settings', icon: '⚙️' },
];

// Init nav
const navEl = document.getElementById('nav-tabs');
tabs.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200 text-ink-300 hover:text-white hover:bg-ink-800/50';
  btn.dataset.tab = t.id;
  btn.innerHTML = `<span class="mr-1.5">${t.icon}</span>${t.label}`;
  btn.onclick = () => switchTab(t.id);
  navEl.appendChild(btn);
});

function switchTab(id) {
  currentTab = id;
  navEl.querySelectorAll('button').forEach(b => {
    b.className = b.dataset.tab === id
      ? 'px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200 tab-active text-white'
      : 'px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200 text-ink-300 hover:text-white hover:bg-ink-800/50';
  });
  render();
}

async function checkHealth() {
  try {
    const r = await fetch(`${API}/health`);
    health = await r.json();
    updateStatus('connected', health?.backend || 'Voicebox');
    document.getElementById('conn-banner').classList.add('hidden');
  } catch {
    health = null;
    updateStatus('disconnected', 'Disconnected');
    document.getElementById('conn-banner').classList.remove('hidden');
  }
}

function updateStatus(state, text) {
  document.getElementById('footer-status-dot').className = `status-dot status-${state}`;
  document.getElementById('footer-status-text').textContent = text;
}

async function loadProfiles() {
  try { profiles = await (await fetch(`${API}/profiles`)).json(); } catch { profiles = []; }
}

async function loadHistory() {
  try {
    const d = await (await fetch(`${API}/history`)).json();
    history = d.items || d || [];
  } catch { history = []; }
}

function render() {
  const c = document.getElementById('content');
  c.innerHTML = '';
  c.className = `max-w-4xl mx-auto px-6 pt-24 pb-20 slide-up ${!health ? 'mt-12' : ''}`;

  if (currentTab === 'generate') renderGenerate(c);
  else if (currentTab === 'voices') renderVoices(c);
  else if (currentTab === 'transcribe') renderTranscribe(c);
  else if (currentTab === 'history') renderHistory(c);
  else if (currentTab === 'settings') renderSettings(c);
}

function renderGenerate(c) {
  c.innerHTML = `
    <div class="glass rounded-2xl p-6 space-y-4">
      <div class="flex items-center justify-between flex-wrap gap-3">
        <h2 class="text-lg font-semibold flex items-center gap-2"><span class="text-neon-blue">⚡</span> Text to Speech</h2>
        <div class="flex items-center gap-3">
          <select id="gen-engine" class="bg-ink-900 border border-ink-700 rounded-lg px-3 py-1.5 text-sm font-mono">
            <option value="qwen3-tts">Qwen3-TTS</option>
            <option value="kokoro">Kokoro</option>
            <option value="chatterbox">Chatterbox</option>
            <option value="luxtts">LuxTTS</option>
            <option value="hume">Hume</option>
          </select>
          <select id="gen-profile" class="bg-ink-900 border border-ink-700 rounded-lg px-3 py-1.5 text-sm">
            <option value="">Default Voice</option>
          </select>
        </div>
      </div>
      <textarea id="gen-text" class="w-full h-40 bg-ink-900/50 border border-ink-700 rounded-xl p-4 text-sm font-mono resize-none placeholder:text-ink-500" placeholder="Type or paste text to convert to speech..."></textarea>
      <div class="flex items-center justify-between">
        <span class="text-xs text-ink-400 font-mono" id="gen-chars">0 characters</span>
        <button id="gen-btn" class="px-6 py-2.5 rounded-xl font-semibold text-sm bg-gradient-to-r from-neon-blue to-ink-500 text-white hover:opacity-90 glow-blue transition-all">⚡ Generate Speech</button>
      </div>
      <div id="gen-error" class="text-neon-pink text-sm hidden"></div>
    </div>
    <div id="gen-result" class="hidden glass rounded-2xl p-6 slide-up">
      <h3 class="text-sm font-semibold text-ink-300 mb-3">Generated Audio</h3>
      <audio id="gen-audio" controls class="w-full"></audio>
      <div class="mt-3 flex gap-2">
        <a id="gen-download" download class="px-4 py-1.5 bg-ink-800 rounded-lg text-xs font-medium hover:bg-ink-700 transition cursor-pointer">📥 Download</a>
      </div>
    </div>`;

  // Populate profiles
  const sel = document.getElementById('gen-profile');
  profiles.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p.id; opt.textContent = p.name;
    sel.appendChild(opt);
  });

  const textarea = document.getElementById('gen-text');
  const charCount = document.getElementById('gen-chars');
  textarea.oninput = () => { charCount.textContent = textarea.value.length + ' characters'; };

  document.getElementById('gen-btn').onclick = async () => {
    const text = textarea.value.trim();
    if (!text) return;
    const btn = document.getElementById('gen-btn');
    const errEl = document.getElementById('gen-error');
    const resultEl = document.getElementById('gen-result');
    btn.innerHTML = '<svg class="animate-spin h-4 w-4 inline mr-2" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>Generating...';
    btn.disabled = true;
    errEl.classList.add('hidden');
    try {
      const res = await fetch(`${API}/generate`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, engine: document.getElementById('gen-engine').value, profile_id: document.getElementById('gen-profile').value || undefined }),
      });
      if (!res.ok) throw new Error('Generation failed');
      const data = await res.json();
      if (data.id) {
        document.getElementById('gen-audio').src = `${API}/audio/${data.id}`;
        document.getElementById('gen-download').href = `${API}/audio/${data.id}`;
        resultEl.classList.remove('hidden');
      }
    } catch (e) { errEl.textContent = e.message; errEl.classList.remove('hidden'); }
    finally { btn.innerHTML = '⚡ Generate Speech'; btn.disabled = false; }
  };
}

function renderVoices(c) {
  let html = `
    <div class="flex items-center justify-between mb-6">
      <h2 class="text-lg font-semibold flex items-center gap-2"><span class="text-neon-pink">🎭</span> Voice Profiles</h2>
      <button id="voice-new-btn" class="px-4 py-2 bg-gradient-to-r from-neon-pink to-ink-500 rounded-xl text-sm font-semibold hover:opacity-90 transition">+ New Voice</button>
    </div>
    <div id="voice-create" class="hidden glass rounded-2xl p-6 space-y-4 slide-up mb-4">
      <input id="v-name" placeholder="Voice name" class="w-full bg-ink-900/50 border border-ink-700 rounded-xl px-4 py-2.5 text-sm">
      <input id="v-desc" placeholder="Description (optional)" class="w-full bg-ink-900/50 border border-ink-700 rounded-xl px-4 py-2.5 text-sm">
      <select id="v-engine" class="bg-ink-900 border border-ink-700 rounded-xl px-4 py-2.5 text-sm w-full">
        <option value="qwen3-tts">Qwen3-TTS</option><option value="kokoro">Kokoro</option><option value="chatterbox">Chatterbox</option>
      </select>
      <div class="flex gap-2">
        <button id="v-create" class="px-4 py-2 bg-neon-green/20 text-neon-green rounded-xl text-sm font-semibold hover:bg-neon-green/30 transition">Create</button>
        <button id="v-cancel" class="px-4 py-2 bg-ink-800 rounded-xl text-sm font-medium hover:bg-ink-700 transition">Cancel</button>
      </div>
    </div>
    <div id="voice-list" class="space-y-3"></div>`;
  c.innerHTML = html;

  document.getElementById('voice-new-btn').onclick = () => document.getElementById('voice-create').classList.toggle('hidden');
  document.getElementById('v-cancel').onclick = () => document.getElementById('voice-create').classList.add('hidden');
  document.getElementById('v-create').onclick = async () => {
    const name = document.getElementById('v-name').value.trim();
    if (!name) return;
    await fetch(`${API}/profiles`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, description: document.getElementById('v-desc').value, engine: document.getElementById('v-engine').value }) });
    await loadProfiles(); render();
  };

  const list = document.getElementById('voice-list');
  if (profiles.length === 0) {
    list.innerHTML = '<div class="glass rounded-2xl p-12 text-center"><p class="text-ink-400 text-lg mb-2">No voice profiles yet</p><p class="text-ink-500 text-sm">Create a voice to get started with voice cloning</p></div>';
    return;
  }
  profiles.forEach(p => {
    const card = document.createElement('div');
    card.className = 'glass rounded-2xl p-5 flex items-center justify-between hover-glow';
    card.innerHTML = `<div><h3 class="font-semibold">${p.name}</h3><p class="text-ink-400 text-sm">${p.description || 'No description'}</p><span class="text-xs text-ink-500 font-mono mt-1 inline-block">${p.engine} • ${new Date(p.created_at).toLocaleDateString()}</span></div><button class="px-3 py-1.5 bg-neon-pink/10 text-neon-pink rounded-lg text-xs hover:bg-neon-pink/20 transition">Delete</button>`;
    card.querySelector('button').onclick = async () => {
      if (!confirm('Delete this voice profile?')) return;
      await fetch(`${API}/profiles/${p.id}`, { method: 'DELETE' });
      await loadProfiles(); render();
    };
    list.appendChild(card);
  });
}

function renderTranscribe(c) {
  c.innerHTML = `
    <div class="glass rounded-2xl p-6 space-y-4">
      <h2 class="text-lg font-semibold flex items-center gap-2"><span class="text-neon-green">📝</span> Speech to Text</h2>
      <div class="border-2 border-dashed border-ink-600 rounded-xl p-8 text-center hover:border-ink-400 transition">
        <input type="file" accept="audio/*" id="stt-file" class="hidden">
        <label for="stt-file" class="cursor-pointer">
          <div class="text-4xl mb-3">🎤</div>
          <p class="text-ink-300 font-medium" id="stt-filename">Drop audio file or click to upload</p>
          <p class="text-ink-500 text-sm mt-1">Supports MP3, WAV, OGG, M4A</p>
        </label>
      </div>
      <button id="stt-btn" class="w-full py-2.5 rounded-xl font-semibold text-sm bg-gradient-to-r from-neon-green to-neon-blue text-ink-950 hover:opacity-90 transition">📝 Transcribe Audio</button>
      <div id="stt-error" class="text-neon-pink text-sm hidden"></div>
    </div>
    <div id="stt-result" class="hidden glass rounded-2xl p-6 slide-up">
      <h3 class="text-sm font-semibold text-ink-300 mb-3">Transcription Result</h3>
      <div id="stt-text" class="bg-ink-900/50 rounded-xl p-4 font-mono text-sm whitespace-pre-wrap"></div>
      <button id="stt-copy" class="mt-3 px-4 py-1.5 bg-ink-800 rounded-lg text-xs font-medium hover:bg-ink-700 transition">📋 Copy</button>
    </div>`;

  let selectedFile = null;
  document.getElementById('stt-file').onchange = (e) => {
    selectedFile = e.target.files[0];
    document.getElementById('stt-filename').textContent = selectedFile ? selectedFile.name : 'Drop audio file or click to upload';
  };

  document.getElementById('stt-btn').onclick = async () => {
    if (!selectedFile) return;
    const btn = document.getElementById('stt-btn');
    btn.textContent = '🔄 Transcribing...'; btn.disabled = true;
    try {
      const fd = new FormData(); fd.append('file', selectedFile);
      const res = await fetch(`${API}/transcribe`, { method: 'POST', body: fd });
      if (!res.ok) throw new Error('Transcription failed');
      const data = await res.json();
      document.getElementById('stt-text').textContent = data.text || data.transcription || JSON.stringify(data);
      document.getElementById('stt-result').classList.remove('hidden');
    } catch (e) { document.getElementById('stt-error').textContent = e.message; document.getElementById('stt-error').classList.remove('hidden'); }
    finally { btn.textContent = '📝 Transcribe Audio'; btn.disabled = false; }
  };

  document.getElementById('stt-copy').onclick = () => navigator.clipboard.writeText(document.getElementById('stt-text').textContent);
}

function renderHistory(c) {
  let html = `<h2 class="text-lg font-semibold flex items-center gap-2 mb-6"><span class="text-neon-orange">📚</span> Generation History</h2>`;
  if (history.length === 0) {
    html += '<div class="glass rounded-2xl p-12 text-center"><p class="text-ink-400 text-lg mb-2">No generations yet</p><p class="text-ink-500 text-sm">Your generated audio will appear here</p></div>';
  } else {
    html += '<div class="space-y-3">';
    history.forEach(g => {
      html += `<div class="glass rounded-2xl p-5 hover-glow"><div class="flex items-start justify-between gap-4"><div class="flex-1 min-w-0"><p class="font-medium truncate">${g.text || 'Untitled'}</p><p class="text-ink-500 text-xs font-mono mt-1">${g.engine || ''} • ${new Date(g.created_at).toLocaleString()}</p></div>${g.id ? `<audio controls src="${API}/audio/${g.id}" class="h-8 flex-shrink-0 max-w-xs"></audio>` : ''}</div></div>`;
    });
    html += '</div>';
  }
  c.innerHTML = html;
}

function renderSettings(c) {
  c.innerHTML = `
    <h2 class="text-lg font-semibold flex items-center gap-2 mb-6"><span class="text-ink-300">⚙️</span> Settings</h2>
    <div class="glass rounded-2xl p-6 space-y-4">
      <h3 class="font-semibold text-sm text-ink-300">Backend Connection</h3>
      <div class="flex items-center gap-3 mb-4">
        <span class="status-dot ${health ? 'status-connected' : 'status-disconnected'}"></span>
        <span class="text-sm">${health ? 'Connected — ' + (health.backend || 'Voicebox') : 'Disconnected'}</span>
      </div>
      <label class="block"><span class="text-xs text-ink-400 font-mono">API URL</span>
        <input id="set-url" value="${API}" class="w-full mt-1 bg-ink-900/50 border border-ink-700 rounded-xl px-4 py-2.5 text-sm font-mono">
      </label>
      <button id="set-save" class="px-4 py-2 bg-ink-700 rounded-xl text-sm font-medium hover:bg-ink-600 transition">Save & Reconnect</button>
    </div>
    <div class="glass rounded-2xl p-6 space-y-3 mt-4">
      <h3 class="font-semibold text-sm text-ink-300">About</h3>
      <p class="text-ink-400 text-sm">iknbite — AI Voice Studio</p>
      <p class="text-ink-500 text-xs">Powered by Voicebox • Open Source • Runs Locally</p>
      <div class="flex gap-2 mt-2">
        <a href="https://github.com/jamiepine/voicebox" target="_blank" class="px-3 py-1.5 bg-ink-800 rounded-lg text-xs font-medium hover:bg-ink-700 transition">GitHub</a>
        <a href="https://voicebox.sh" target="_blank" class="px-3 py-1.5 bg-ink-800 rounded-lg text-xs font-medium hover:bg-ink-700 transition">Docs</a>
      </div>
    </div>`;
  document.getElementById('set-save').onclick = () => {
    localStorage.setItem('iknbite_api_url', document.getElementById('set-url').value);
    window.location.reload();
  };
}

// Init
checkHealth();
loadProfiles().then(() => loadHistory().then(() => render()));
setInterval(checkHealth, 15000);
</script>
</body>
</html>
