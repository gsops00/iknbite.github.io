        <div class="glass rounded-3xl p-10 md:p-14 text-center glow relative overflow-hidden">
          <div class="absolute inset-0 bg-gradient-to-br from-brand-600/10 to-purple-600/10"></div>
          <div class="relative z-10">
            <h2 class="text-3xl md:text-4xl font-bold mb-4">Ready to build with your voice?</h2>
            <p class="text-zinc-400 text-lg mb-8 max-w-lg mx-auto">Free, open source, and runs on macOS, Linux, and Windows.</p>
            <button onclick="currentView='app';render()" class="btn-primary text-base py-3.5 px-10">
              Launch iknbite Studio →
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="py-10 border-t border-white/5">
      <div class="max-w-7xl mx-auto px-6 flex flex-col md:flex-row items-center justify-between gap-4">
        <div class="flex items-center gap-2">
          <div class="w-6 h-6 rounded-md bg-gradient-to-br from-brand-500 to-purple-500 flex items-center justify-center">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="white"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/></svg>
          </div>
          <span class="text-sm font-semibold">iknbite.com</span>
        </div>
        <p class="text-sm text-zinc-600">Open source AI voice studio. Powered by Voicebox.</p>
      </div>
    </footer>
  </div>`;
}

// ─── App View ───
function renderApp() {
  document.getElementById('app').innerHTML = `
  <div class="min-h-screen noise">
    <nav class="glass fixed top-0 left-0 right-0 z-50 px-6 h-14">
      <div class="max-w-7xl mx-auto h-full flex items-center justify-between">
        <div class="flex items-center gap-3 cursor-pointer" onclick="currentView='landing';render()">
          <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-brand-500 to-purple-500 flex items-center justify-center">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="white"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/></svg>
          </div>
          <span class="text-sm font-bold">iknbite</span>
        </div>
        <div class="flex items-center gap-1" id="app-tabs"></div>
        <div class="flex items-center gap-2 text-xs text-zinc-500">
          <span id="app-status" class="status-dot status-loading"></span>
          <span id="app-status-text">Connecting...</span>
        </div>
      </div>
    </nav>
    <main id="app-content" class="max-w-4xl mx-auto px-6 pt-20 pb-24"></main>
  </div>`;

  const tabsEl = document.getElementById('app-tabs');
  tabs.forEach(t => {
    const btn = document.createElement('button');
    btn.className = `px-3 py-1.5 rounded-lg text-xs font-medium transition-all ${t.id===currentTab?'tab-active':'text-zinc-500 hover:text-zinc-300 hover:bg-white/5'}`;
    btn.dataset.tab = t.id;
    btn.innerHTML = `<span class="mr-1.5 inline-flex">${t.icon}</span>${t.label}`;
    btn.onclick = () => switchTab(t.id);
    tabsEl.appendChild(btn);
  });

  checkHealth();
  loadProfiles().then(() => loadHistory().then(() => renderTab()));
}

function switchTab(id) {
  currentTab = id;
  document.getElementById('app-tabs').querySelectorAll('button').forEach(b => {
    b.className = b.dataset.tab===id
      ? 'px-3 py-1.5 rounded-lg text-xs font-medium transition-all tab-active'
      : 'px-3 py-1.5 rounded-lg text-xs font-medium transition-all text-zinc-500 hover:text-zinc-300 hover:bg-white/5';
  });
  renderTab();
}

async function checkHealth() {
  try {
    const r = await fetch(`${API}/health`);
    health = await r.json();
    const dot = document.getElementById('app-status');
    const txt = document.getElementById('app-status-text');
    if(dot) { dot.className='status-dot status-connected'; txt.textContent=`Connected — ${health.backend||'Voicebox'}`; }
  } catch {
    health = null;
    const dot = document.getElementById('app-status');
    const txt = document.getElementById('app-status-text');
    if(dot) { dot.className='status-dot status-disconnected'; txt.textContent='Disconnected'; }
  }
}

async function loadProfiles() {
  try { profiles = await (await fetch(`${API}/profiles`)).json(); } catch { profiles = []; }
}

async function loadHistory() {
  try {
    const d = await (await fetch(`${API}/history`)).json();
    history = d.items || d || [];
  } catch { history = []; }
}

function renderTab() {
  const c = document.getElementById('app-content');
  c.className = 'max-w-4xl mx-auto px-6 pt-20 pb-24 slide-up';
  if(currentTab==='generate') renderGenerate(c);
  else if(currentTab==='voices') renderVoices(c);
  else if(currentTab==='transcribe') renderTranscribe(c);
  else if(currentTab==='history') renderHistory(c);
  else if(currentTab==='settings') renderSettings(c);
}

function renderGenerate(c) {
  c.innerHTML = `
    <div class="glass-light rounded-2xl p-6 space-y-4">
      <div class="flex items-center justify-between flex-wrap gap-3">
        <h2 class="text-lg font-semibold flex items-center gap-2"><span class="text-brand-400">⚡</span> Text to Speech</h2>
        <div class="flex items-center gap-2">
          <select id="gen-engine" class="bg-surface-900 border border-white/10 rounded-xl px-3 py-2 text-xs font-mono text-zinc-300">
            <option value="qwen3-tts">Qwen3-TTS</option><option value="kokoro">Kokoro</option><option value="chatterbox">Chatterbox</option><option value="luxtts">LuxTTS</option><option value="hume">Hume</option>
          </select>
          <select id="gen-profile" class="bg-surface-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-zinc-300">
            <option value="">Default Voice</option>
          </select>
        </div>
      </div>
      <textarea id="gen-text" class="w-full h-36 bg-surface-900/50 border border-white/10 rounded-xl p-4 text-sm font-mono resize-none placeholder:text-zinc-600 text-zinc-200" placeholder="Type or paste text to convert to speech..."></textarea>
      <div class="flex items-center justify-between">
        <span class="text-xs text-zinc-600 font-mono" id="gen-chars">0 characters</span>
        <button id="gen-btn" class="btn-primary text-sm py-2.5 px-6">⚡ Generate Speech</button>
      </div>
      <div id="gen-error" class="text-red-400 text-sm hidden"></div>
    </div>
    <div id="gen-result" class="hidden glass-light rounded-2xl p-6 slide-up">
      <h3 class="text-xs font-semibold text-zinc-500 mb-3 uppercase tracking-wide">Generated Audio</h3>
      <audio id="gen-audio" controls class="w-full rounded-xl"></audio>
      <div class="mt-3 flex gap-2"><a id="gen-download" download class="px-4 py-1.5 bg-white/5 rounded-lg text-xs font-medium hover:bg-white/10 transition cursor-pointer">📥 Download</a></div>
    </div>`;

  const sel = document.getElementById('gen-profile');
  profiles.forEach(p => { const o = document.createElement('option'); o.value=p.id; o.textContent=p.name; sel.appendChild(o); });
  document.getElementById('gen-text').oninput = function() { document.getElementById('gen-chars').textContent=this.value.length+' characters'; };
  document.getElementById('gen-btn').onclick = async () => {
    const text = document.getElementById('gen-text').value.trim();
    if(!text) return;
    const btn = document.getElementById('gen-btn');
    btn.innerHTML = '<svg class="animate-spin h-4 w-4 inline mr-2" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>Generating...';
    btn.disabled = true;
    try {
      const res = await fetch(`${API}/generate`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({text,engine:document.getElementById('gen-engine').value,profile_id:document.getElementById('gen-profile').value||undefined}) });
      if(!res.ok) throw new Error('Generation failed');
      const data = await res.json();
      if(data.id) {
        document.getElementById('gen-audio').src = `${API}/audio/${data.id}`;
        document.getElementById('gen-download').href = `${API}/audio/${data.id}`;
        document.getElementById('gen-result').classList.remove('hidden');
      }
    } catch(e) { document.getElementById('gen-error').textContent=e.message; document.getElementById('gen-error').classList.remove('hidden'); }
    finally { btn.innerHTML='⚡ Generate Speech'; btn.disabled=false; }
  };
}

function renderVoices(c) {
  c.innerHTML = `
    <div class="flex items-center justify-between mb-6">
      <h2 class="text-lg font-semibold flex items-center gap-2"><span class="text-purple-400">🎭</span> Voice Profiles</h2>
      <button id="voice-new" class="btn-primary text-sm py-2 px-5">+ New Voice</button>
    </div>
    <div id="voice-create" class="hidden glass-light rounded-2xl p-6 space-y-3 slide-up mb-4">
      <input id="v-name" placeholder="Voice name" class="w-full bg-surface-900/50 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-zinc-200 placeholder:text-zinc-600">
      <input id="v-desc" placeholder="Description (optional)" class="w-full bg-surface-900/50 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-zinc-200 placeholder:text-zinc-600">
      <select id="v-engine" class="bg-surface-900 border border-white/10 rounded-xl px-4 py-2.5 text-sm w-full text-zinc-300"><option value="qwen3-tts">Qwen3-TTS</option><option value="kokoro">Kokoro</option><option value="chatterbox">Chatterbox</option></select>
      <div class="flex gap-2"><button id="v-create" class="btn-primary text-sm py-2 px-5">Create</button><button id="v-cancel" class="btn-secondary text-sm py-2 px-5">Cancel</button></div>
    </div>
    <div id="voice-list" class="space-y-3"></div>`;
  document.getElementById('voice-new').onclick = () => document.getElementById('voice-create').classList.toggle('hidden');
  document.getElementById('v-cancel').onclick = () => document.getElementById('voice-create').classList.add('hidden');
  document.getElementById('v-create').onclick = async () => {
    const name = document.getElementById('v-name').value.trim();
    if(!name) return;
    await fetch(`${API}/profiles`, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,description:document.getElementById('v-desc').value,engine:document.getElementById('v-engine').value})});
    await loadProfiles(); renderTab();
  };
  const list = document.getElementById('voice-list');
  if(!profiles.length) { list.innerHTML='<div class="glass-light rounded-2xl p-12 text-center"><p class="text-zinc-500 text-lg mb-2">No voice profiles yet</p><p class="text-zinc-600 text-sm">Create a voice to get started with voice cloning</p></div>'; return; }
  profiles.forEach(p => {
    const d = document.createElement('div');
    d.className = 'glass-light rounded-2xl p-5 flex items-center justify-between card-hover';
    d.innerHTML = `<div><h3 class="font-semibold">${p.name}</h3><p class="text-zinc-500 text-sm">${p.description||'No description'}</p><span class="text-xs text-zinc-600 font-mono mt-1 inline-block">${p.engine} • ${new Date(p.created_at).toLocaleDateString()}</span></div><button class="px-3 py-1.5 bg-red-500/10 text-red-400 rounded-lg text-xs hover:bg-red-500/20 transition">Delete</button>`;
    d.querySelector('button').onclick = async () => { if(!confirm('Delete this voice profile?'))return; await fetch(`${API}/profiles/${p.id}`,{method:'DELETE'}); await loadProfiles(); renderTab(); };
    list.appendChild(d);
  });
}

function renderTranscribe(c) {
  c.innerHTML = `
    <div class="glass-light rounded-2xl p-6 space-y-4">
      <h2 class="text-lg font-semibold flex items-center gap-2"><span class="text-green-400">📝</span> Speech to Text</h2>
      <div class="border-2 border-dashed border-white/10 rounded-xl p-10 text-center hover:border-white/20 transition">
        <input type="file" accept="audio/*" id="stt-file" class="hidden">
        <label for="stt-file" class="cursor-pointer"><div class="text-5xl mb-3">🎤</div><p class="text-zinc-300 font-medium" id="stt-filename">Drop audio file or click to upload</p><p class="text-zinc-600 text-sm mt-1">MP3, WAV, OGG, M4A</p></label>
      </div>
      <button id="stt-btn" class="w-full py-2.5 rounded-xl font-semibold text-sm bg-gradient-to-r from-green-500 to-cyan-500 text-surface-950 hover:opacity-90 transition">📝 Transcribe Audio</button>
      <div id="stt-error" class="text-red-400 text-sm hidden"></div>
    </div>
    <div id="stt-result" class="hidden glass-light rounded-2xl p-6 slide-up">
      <h3 class="text-xs font-semibold text-zinc-500 mb-3 uppercase tracking-wide">Result</h3>
      <div id="stt-text" class="bg-surface-900/50 rounded-xl p-4 font-mono text-sm whitespace-pre-wrap text-zinc-200"></div>
      <button id="stt-copy" class="mt-3 px-4 py-1.5 bg-white/5 rounded-lg text-xs font-medium hover:bg-white/10 transition">📋 Copy</button>
    </div>`;
  let selectedFile = null;
  document.getElementById('stt-file').onchange = (e) => { selectedFile=e.target.files[0]; document.getElementById('stt-filename').textContent=selectedFile?selectedFile.name:'Drop audio file or click to upload'; };
  document.getElementById('stt-btn').onclick = async () => {
    if(!selectedFile) return;
    const btn = document.getElementById('stt-btn'); btn.textContent='🔄 Transcribing...'; btn.disabled=true;
    try {
      const fd = new FormData(); fd.append('file',selectedFile);
      const res = await fetch(`${API}/transcribe`,{method:'POST',body:fd});
      if(!res.ok) throw new Error('Transcription failed');
      const data = await res.json();
      document.getElementById('stt-text').textContent = data.text||data.transcription||JSON.stringify(data);
      document.getElementById('stt-result').classList.remove('hidden');
    } catch(e) { document.getElementById('stt-error').textContent=e.message; document.getElementById('stt-error').classList.remove('hidden'); }
    finally { btn.textContent='📝 Transcribe Audio'; btn.disabled=false; }
  };
  document.getElementById('stt-copy').onclick = () => navigator.clipboard.writeText(document.getElementById('stt-text').textContent);
}

function renderHistory(c) {
  let h = `<h2 class="text-lg font-semibold flex items-center gap-2 mb-6"><span class="text-orange-400">📚</span> Generation History</h2>`;
  if(!history.length) { h+='<div class="glass-light rounded-2xl p-12 text-center"><p class="text-zinc-500 text-lg mb-2">No generations yet</p><p class="text-zinc-600 text-sm">Your generated audio will appear here</p></div>'; }
  else { h+='<div class="space-y-3">'; history.forEach(g => {
    h+=`<div class="glass-light rounded-2xl p-5 card-hover"><div class="flex items-start justify-between gap-4"><div class="flex-1 min-w-0"><p class="font-medium truncate text-zinc-200">${g.text||'Untitled'}</p><p class="text-zinc-600 text-xs font-mono mt-1">${g.engine||''} • ${new Date(g.created_at).toLocaleString()}</p></div>${g.id?`<audio controls src="${API}/audio/${g.id}" class="h-8 flex-shrink-0 max-w-xs rounded-lg"></audio>`:''}</div></div>`;
  }); h+='</div>'; }
  c.innerHTML = h;
}

function renderSettings(c) {
  c.innerHTML = `
    <h2 class="text-lg font-semibold flex items-center gap-2 mb-6"><span class="text-zinc-400">⚙️</span> Settings</h2>
    <div class="glass-light rounded-2xl p-6 space-y-4">
      <h3 class="font-semibold text-sm text-zinc-400">Backend Connection</h3>
      <div class="flex items-center gap-3 mb-4"><span class="status-dot ${health?'status-connected':'status-disconnected'}"></span><span class="text-sm text-zinc-300">${health?'Connected — '+(health.backend||'Voicebox'):'Disconnected'}</span></div>
      <label class="block"><span class="text-xs text-zinc-500 font-mono">API URL</span><input id="set-url" value="${API}" class="w-full mt-1 bg-surface-900/50 border border-white/10 rounded-xl px-4 py-2.5 text-sm font-mono text-zinc-200"></label>
      <button id="set-save" class="btn-secondary text-sm py-2 px-5">Save & Reconnect</button>
    </div>
    <div class="glass-light rounded-2xl p-6 space-y-3 mt-4">
      <h3 class="font-semibold text-sm text-zinc-400">About</h3>
      <p class="text-zinc-300 text-sm">iknbite — AI Voice Studio</p>
      <p class="text-zinc-600 text-xs">Powered by Voicebox • Open Source • Runs Locally</p>
      <div class="flex gap-2 mt-2"><a href="https://github.com/jamiepine/voicebox" target="_blank" class="btn-secondary text-xs py-1.5 px-3">GitHub</a><a href="https://voicebox.sh" target="_blank" class="btn-secondary text-xs py-1.5 px-3">Docs</a></div>
    </div>`;
  document.getElementById('set-save').onclick = () => { localStorage.setItem('iknbite_api_url',document.getElementById('set-url').value); window.location.reload(); };
}

// ─── Init ───
function render() {
  if(currentView==='landing') renderLanding();
  else renderApp();
}
render();
</script>
</body>
</html>
