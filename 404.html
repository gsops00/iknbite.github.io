<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — iknbite</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎙️</text></svg>">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',system-ui,sans-serif;background:#fafafa;color:#171717;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center}
    .code{font-size:120px;font-weight:800;letter-spacing:-0.04em;background:linear-gradient(135deg,#4c6ef5,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1}
    h2{font-size:20px;margin:16px 0 8px}
    p{color:#737373;font-size:14px;margin-bottom:24px}
    a{display:inline-flex;align-items:center;gap:6px;padding:10px 24px;border-radius:12px;background:#4c6ef5;color:#fff;text-decoration:none;font-weight:600;font-size:14px;transition:all .2s}
    a:hover{background:#4263eb;transform:translateY(-1px)}
  </style>
</head>
<body>
  <div>
    <div class="code">404</div>
    <h2>Page not found</h2>
    <p>The page you're looking for doesn't exist or has been moved.</p>
    <a href="/">🎙️ Back to iknbite</a>
  </div>
</body>
</html>
