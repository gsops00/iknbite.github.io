services:
  tts:
    build: .
    ports:
      - "5050:5050"
    environment:
      - TTS_HOST=0.0.0.0
      - TTS_PORT=5050
      - TTS_API_KEY=${TTS_API_KEY:-}
      - TTS_DEVICE=${TTS_DEVICE:-}
      - TTS_TARGET_LUFS=-16.0
      - TTS_SAMPLE_RATE=24000
    volumes:
      - tts-models:/root/.cache
      - tts-voices:/root/.local/share/piper
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Edge TTS Worker (free, 300+ voices, no GPU needed)
  edge-tts:
    image: ghcr.io/traefik/traefik:v3.0
    profiles:
      - edge
    ports:
      - "8080:80"
    volumes:
      - ./edge-tts-worker.js:/etc/traefik/dynamic/edge-tts.js:ro
    restart: unless-stopped

volumes:
  tts-models:
  tts-voices:
